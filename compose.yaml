# Local development database: `docker compose up -d`, then run the API with no extra settings.
# The init script creates the application's login (studiomanager_app, a member of app_rw);
# Flyway migrates as the owner (studiomanager). See api/src/main/resources/application.yaml.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: studiomanager
      POSTGRES_USER: studiomanager
      POSTGRES_PASSWORD: studiomanager
    ports:
      - "5432:5432"
    volumes:
      - ./api/dev/postgres-init:/docker-entrypoint-initdb.d:ro
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiomanager -d studiomanager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
