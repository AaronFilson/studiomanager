spring:
  jpa:
    properties:
      hibernate:
        # StatementCounts reads Hibernate's statistics to catch N+1 queries (ADR 21)
        generate_statistics: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: tests authenticate with Spring Security's jwt() request post-processor
          issuer-uri: https://issuer.test/
          audiences: studiomanager-api-test

studiomanager:
  webhooks:
    # The tests' receiver listens on localhost. PublicAddressesTests and WebhookApiTests cover the
    # filter with this off.
    allow-private-networks: true
