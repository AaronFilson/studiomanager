spring:
  application:
    name: studiomanager-api
  threads:
    virtual:
      enabled: true
  # Defaults match the local database in compose.yaml. Azure overrides them (application-azure.yaml).
  datasource:
    url: jdbc:postgresql://${STUDIOMANAGER_DB_HOST:localhost}:${STUDIOMANAGER_DB_PORT:5432}/${STUDIOMANAGER_DB_NAME:studiomanager}
    username: ${STUDIOMANAGER_DB_USER:studiomanager_app}
    password: ${STUDIOMANAGER_DB_PASSWORD:studiomanager_app}
  flyway:
    # Migrations run as the schema owner. The application connects as a member of app_rw, which
    # owns nothing, so row-level security always applies to it (see RowLevelSecurityGuard).
    user: ${STUDIOMANAGER_DB_MIGRATION_USER:studiomanager}
    password: ${STUDIOMANAGER_DB_MIGRATION_PASSWORD:studiomanager}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  modulith:
    events:
      jdbc:
        # Flyway creates event_publication (V10); the app's login can't create tables
        schema-initialization:
          enabled: false
      # A publication stuck this long (the instance died mid-send) is marked failed, and then
      # retried by OutboxRetry like any other failure.
      staleness:
        check-interval: PT1M
        published: PT15M
        processing: PT15M
        resubmitted: PT15M
      # Kafka streaming follows studiomanager.stream.enabled
      externalization:
        enabled: ${studiomanager.stream.enabled}
  kafka:
    bootstrap-servers: ${STUDIOMANAGER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Creating the topics at startup gives up after 5 s if the broker can't be reached (logged,
      # not fatal), rather than holding a cold start for 30 s
      operation-timeout: 5s
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 5000
    producer:
      # Waits for every in-sync replica and never writes a duplicate on retry
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Modulith's externalizer hands over the event already serialized, as JSON bytes. A JSON
      # serializer here would encode those bytes again, as a base64 string
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        interceptor.classes: io.github.aaronfilson.studiomanager.stream.DropTypeIdHeader
    consumer:
      # A new consumer group reads what the topic still holds (7 days). Ids it has already counted
      # are skipped; to rebuild, clear the projection's seen ids too (ActivityProjection)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # Entra External ID: https://<tenant-id>.ciamlogin.com/<tenant-id>/v2.0
          issuer-uri: ${STUDIOMANAGER_AUTH_ISSUER_URI}
          # The API app registration's client ID
          audiences: ${STUDIOMANAGER_AUTH_AUDIENCE}

server:
  compression:
    # JSON compresses several-fold, which is most of what egress costs (plan 20)
    enabled: true
    mime-types: application/json, application/problem+json, text/csv
    min-response-size: 2KB

# OpenTelemetry (spring-cloud-azure-starter-monitor) sends to Application Insights. Off locally
# and in tests, where there is nowhere to send it; application-azure.yaml turns it on.
otel:
  sdk:
    disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

studiomanager:
  cors:
    allowed-origins: ${STUDIOMANAGER_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    # "log" writes each email to the log, for local work; "acs" sends with Azure Communication Services
    sender: ${STUDIOMANAGER_MAIL_SENDER:log}
    from: ${STUDIOMANAGER_MAIL_FROM:DoNotReply@studiomanager.localhost}
    acs-endpoint: ${STUDIOMANAGER_MAIL_ACS_ENDPOINT:}
    # Links in emails point here
    web-origin: ${STUDIOMANAGER_WEB_ORIGIN:http://localhost:5173}
  storage:
    # Azure sets the endpoint and the API signs in as its managed identity. Without one, it uses
    # the connection string: by default, Azurite from compose.yaml with its well-known dev key.
    blob-endpoint: ${STUDIOMANAGER_STORAGE_BLOB_ENDPOINT:}
    connection-string: ${STUDIOMANAGER_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
    container: piece-photos
  webhooks:
    # AES-256, base64: encrypts endpoints' signing secrets at rest. Blank uses a fixed development
    # key; application-azure.yaml requires a real one.
    secret-key: ${STUDIOMANAGER_WEBHOOK_SECRET_KEY:}
    # true lets webhooks reach localhost and private networks: local work and tests only
    allow-private-networks: ${STUDIOMANAGER_WEBHOOK_ALLOW_PRIVATE_NETWORKS:false}
  ai:
    # AES-256, base64: encrypts studios' own AI keys at rest. Blank uses a fixed development key;
    # application-azure.yaml requires a real one.
    key-encryption-key: ${STUDIOMANAGER_AI_KEY_ENCRYPTION_KEY:}
    anthropic-base-url: ${STUDIOMANAGER_ANTHROPIC_BASE_URL:https://api.anthropic.com}
  stream:
    # Publishes StudioStreamEvents to Kafka. Off by default: there's no broker locally unless
    # compose's "stream" profile is up, and none deployed (docs/planning/11)
    enabled: ${STUDIOMANAGER_STREAM_ENABLED:false}
