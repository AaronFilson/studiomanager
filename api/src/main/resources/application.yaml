spring:
  application:
    name: studiomanager-api
  threads:
    virtual:
      enabled: true
  # Defaults match the local database in compose.yaml. Azure overrides them (application-azure.yaml).
  datasource:
    url: jdbc:postgresql://${STUDIOMANAGER_DB_HOST:localhost}:${STUDIOMANAGER_DB_PORT:5432}/${STUDIOMANAGER_DB_NAME:studiomanager}
    username: ${STUDIOMANAGER_DB_USER:studiomanager_app}
    password: ${STUDIOMANAGER_DB_PASSWORD:studiomanager_app}
  flyway:
    # Migrations run as the schema owner. The application connects as a member of app_rw, which
    # owns nothing, so row-level security always applies to it (see RowLevelSecurityGuard).
    user: ${STUDIOMANAGER_DB_MIGRATION_USER:studiomanager}
    password: ${STUDIOMANAGER_DB_MIGRATION_PASSWORD:studiomanager}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  modulith:
    events:
      jdbc:
        # Flyway creates event_publication (V10); the app's login can't create tables
        schema-initialization:
          enabled: false
      # A publication stuck this long (the instance died mid-send) is marked failed, and then
      # retried by OutboxRetry like any other failure.
      staleness:
        check-interval: PT1M
        published: PT15M
        processing: PT15M
        resubmitted: PT15M
  security:
    oauth2:
      resourceserver:
        jwt:
          # Entra External ID: https://<tenant-id>.ciamlogin.com/<tenant-id>/v2.0
          issuer-uri: ${STUDIOMANAGER_AUTH_ISSUER_URI}
          # The API app registration's client ID
          audiences: ${STUDIOMANAGER_AUTH_AUDIENCE}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db

studiomanager:
  cors:
    allowed-origins: ${STUDIOMANAGER_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    # "log" writes each email to the log, for local work; "acs" sends with Azure Communication Services
    sender: ${STUDIOMANAGER_MAIL_SENDER:log}
    from: ${STUDIOMANAGER_MAIL_FROM:DoNotReply@studiomanager.localhost}
    acs-endpoint: ${STUDIOMANAGER_MAIL_ACS_ENDPOINT:}
    # Links in emails point here
    web-origin: ${STUDIOMANAGER_WEB_ORIGIN:http://localhost:5173}
  storage:
    # Azure sets the endpoint and the API signs in as its managed identity. Without one, it uses
    # the connection string: by default, Azurite from compose.yaml with its well-known dev key.
    blob-endpoint: ${STUDIOMANAGER_STORAGE_BLOB_ENDPOINT:}
    connection-string: ${STUDIOMANAGER_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
    container: piece-photos
