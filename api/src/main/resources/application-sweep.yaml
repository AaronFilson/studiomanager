# Used with the azure profile by the sweep job: run every sweep once, then exit (SweepJob, ADR 23).
# Same identity and settings as the API, without a web server or the schedule.
spring:
  main:
    web-application-type: none
  task:
    execution:
      shutdown:
        # Work a sweep handed to another thread (a resubmitted email, a first webhook attempt)
        # finishes before the process exits
        await-termination: true
        await-termination-period: 60s
