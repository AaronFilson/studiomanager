spring:
  datasource:
    # Passwordless: the driver plugin trades the managed identity (AZURE_CLIENT_ID) for an Entra
    # token on each new connection. The login is the identity's Postgres principal.
    url: jdbc:postgresql://${STUDIOMANAGER_DB_HOST}:5432/${STUDIOMANAGER_DB_NAME}?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
    username: ${STUDIOMANAGER_DB_USER}
    password: ""
  flyway:
    # A separate job runs migrations with a more privileged identity (application-migrate.yaml)
    enabled: false

server:
  # Container Apps' ingress is a proxy on a private address. Trusting its X-Forwarded-For gives a
  # token's last-used address as the caller's, not the proxy's (plan 17, step 1)
  forward-headers-strategy: native

# Traces, metrics and logs to Application Insights. The connection string comes from the
# APPLICATIONINSIGHTS_CONNECTION_STRING secret (infra/modules/api); the cloud role name is
# spring.application.name.
otel:
  sdk:
    disabled: false

studiomanager:
  webhooks:
    # No default: the API won't start without the key that encrypts webhook secrets. It comes from
    # Key Vault (open at first deploy: docs/planning/10-webhooks-plan.md).
    secret-key: ${STUDIOMANAGER_WEBHOOK_SECRET_KEY}
    allow-private-networks: false
  ai:
    # No default: studios' AI keys are encrypted under this, from Key Vault (docs/planning/16)
    key-encryption-key: ${STUDIOMANAGER_AI_KEY_ENCRYPTION_KEY}

logging:
  structured:
    format:
      console: ecs
