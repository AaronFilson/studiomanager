spring:
  datasource:
    # Passwordless: the driver plugin trades the managed identity (AZURE_CLIENT_ID) for an Entra
    # token on each new connection. The login is the identity's Postgres principal.
    url: jdbc:postgresql://${STUDIOMANAGER_DB_HOST}:5432/${STUDIOMANAGER_DB_NAME}?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
    username: ${STUDIOMANAGER_DB_USER}
    password: ""
  flyway:
    # A separate job runs migrations with a more privileged identity (application-migrate.yaml)
    enabled: false

logging:
  structured:
    format:
      console: ecs
