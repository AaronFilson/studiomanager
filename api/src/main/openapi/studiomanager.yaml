        proposedAt:
          type: string
          format: date-time
        decidedByName:
          type: string
        decidedAt:
          type: string
          format: date-time
        decisionNote:
          type: string
        resultId:
          type: string
          format: uuid
          description: What approving made, the purchase request or the maintenance task.
        version:
          type: integer
          format: int64

