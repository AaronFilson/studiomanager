      tags: [supplies]
      operationId: createPurchaseRequest
      summary: Ask for more of an item (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseRequestRequest"
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/purchase-requests/{requestId}/status:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [supplies]
      operationId: decidePurchaseRequest
      summary: Approve or reject (owner), or mark ordered or received (staff)
      description: Received puts the quantity into stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecidePurchaseRequest"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token from Microsoft Entra External ID for the Studio Manager API.

  parameters:
    StudioId:
      name: studioId
      in: path
      required: true
      description: The studio (tenant). Every studio-scoped route starts with it.
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PieceId:
      name: pieceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KilnId:
      name: kilnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FiringId:
      name: firingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoredValueId:
      name: storedValueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time

  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller is not a member of the studio, or lacks the role required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such thing, or not one the caller may see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Someone else changed it at the same time. Reload and try again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Me:
      type: object
      required: [account, memberships]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    Account:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          description: From the token's `name` claim, when the identity provider sends one.
        email:
          type: string
          description: From the token's `email` claim, when the identity provider sends one.

    Membership:
      type: object
      required: [studio, role]
      properties:
        studio:
          $ref: "#/components/schemas/StudioSummary"
        role:
          $ref: "#/components/schemas/StudioRole"

    StudioSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Studio:
      type: object
      required: [id, name, unitSystem, timeZone, country, currency, myRole, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unitSystem:
          $ref: "#/components/schemas/UnitSystem"
        timeZone:
          type: string
          description: IANA time zone ID, for example `America/Chicago`.
          examples: [America/Chicago]
        country:
          $ref: "#/components/schemas/Country"
        currency:
          $ref: "#/components/schemas/Currency"
        myRole:
          $ref: "#/components/schemas/StudioRole"
        memberCount:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time

    CreateStudioRequest:
      type: object
      required: [name, unitSystem, timeZone, country]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        unitSystem:
          $ref: "#/components/schemas/UnitSystem"
        timeZone:
          type: string
          maxLength: 64
          description: IANA time zone ID. Web clients send the browser's zone.
          examples: [America/Chicago]
        country:
          $ref: "#/components/schemas/Country"
        currency:
          $ref: "#/components/schemas/Currency"

    Country:
      type: string
      description: |
        Where the studio operates, as an ISO 3166-1 alpha-2 code. Drives sales tax, the
        default currency and which accounting integrations are offered.
      pattern: "^[A-Z]{2}$"
      examples: [US]

    Currency:
      type: string
      description: |
        The studio's currency, as an ISO 4217 code. On create it defaults to the country's
        currency. All of the studio's money is kept in it.
      pattern: "^[A-Z]{3}$"
      examples: [USD]

    StudioRole:
      type: string
      description: |
        The base role in a studio. OWNER administers the studio's account (for a co-op or
        nonprofit, whoever holds that responsibility), STAFF help run it, MEMBER makes pots.
        Duties such as technician or monitor, and certifications on equipment, are granted
        separately on top of a role.
      enum: [OWNER, STAFF, MEMBER]

    UnitSystem:
      type: string
      description: The studio's default display units. Measurements are always stored in SI.
      enum: [US_CUSTOMARY, METRIC]

    Member:
      type: object
      required: [accountId, role, joinedAt]
      properties:
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/StudioRole"
        joinedAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/StudioRole"

    Invite:
      type: object
      required: [id, code, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Share this with the invitee. It is shown only once.
        role:
          $ref: "#/components/schemas/StudioRole"
        expiresAt:
          type: string
          format: date-time

    OpenInvite:
      type: object
      required: [id, role, createdAt, expiresAt, expired]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Who it was emailed to. Absent for a link invite.
        role:
          $ref: "#/components/schemas/StudioRole"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        expired:
          type: boolean
        lastSentAt:
          type: string
          format: date-time
          description: When the email last went out. Absent until it has, and for link invites.

    EmailInvitesRequest:
      type: object
      required: [text, role]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
          description: Email addresses, separated by commas, semicolons, spaces or new lines.
        role:
          $ref: "#/components/schemas/StudioRole"

    EmailInvitesResult:
      type: object
      required: [invited, skipped]
      properties:
        invited:
          type: array
          items:
            $ref: "#/components/schemas/OpenInvite"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedEmail"

    SkippedEmail:
      type: object
      required: [email, reason]
      properties:
        email:
          type: string
        reason:
          type: string
          description: |
            ALREADY_MEMBER: someone in the studio signs in with this address. ALREADY_INVITED: it
            has an unexpired invite; resend that one instead.
          enum: [ALREADY_MEMBER, ALREADY_INVITED]

    Decimal:
      type: string
      description: A non-negative decimal, as a string so no precision is lost (for example `"0.05"`).
      pattern: "^\\d{1,9}(\\.\\d{1,4})?$"
      examples: ["0.05"]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: The amount at the currency's minor-unit scale, for example `"48.00"`.
          examples: ["48.00"]
        currency:
          $ref: "#/components/schemas/Currency"

    LengthUnit:
      type: string
      enum: [MILLIMETRE, CENTIMETRE, INCH]

    WeightUnit:
      type: string
      enum: [GRAM, KILOGRAM, POUND, OUNCE]

    Dimensions:
      type: object
      description: The piece's bounding box, in the unit it was measured in.
      required: [length, width, height, unit]
      properties:
        length:
          $ref: "#/components/schemas/Decimal"
        width:
          $ref: "#/components/schemas/Decimal"
        height:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/LengthUnit"

    WeightMeasure:
      type: object
      required: [value, unit]
      properties:
        value:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/WeightUnit"

    PieceSize:
      type: object
      description: What was measured. A studio pricing by volume needs dimensions; by weight, the weight.
      properties:
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        weight:
          $ref: "#/components/schemas/WeightMeasure"

    FeeRuleType:
      type: string
      description: PER_VOLUME prices the bounding box, PER_WEIGHT the weight, FLAT every piece the same.
      enum: [PER_VOLUME, PER_WEIGHT, FLAT]

    FeeUnit:
      type: string
      description: The unit the rate is per. Volume units for PER_VOLUME, weight units for PER_WEIGHT, none for FLAT.
      enum: [CUBIC_INCH, CUBIC_CENTIMETRE, LITRE, POUND, KILOGRAM]

    FeeRounding:
      type: string
      description: |
        How each dimension (or the weight) is rounded up, in the rule's own unit, before pricing.
        WHOLE_UNIT is "round each side up to the next whole inch".
      enum: [NONE, HALF_UNIT, WHOLE_UNIT]

    FeeSchedule:
      type: object
      required: [version, ruleType, rate, rounding, minimum, taxCategory]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        ruleType:
          $ref: "#/components/schemas/FeeRuleType"
        rate:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/FeeUnit"
        rounding:
          $ref: "#/components/schemas/FeeRounding"
        minimum:
          $ref: "#/components/schemas/Decimal"
        taxCategory:
          type: string

    SaveFeeScheduleRequest:
      type: object
      required: [ruleType, rate, rounding, minimum]
      properties:
        ruleType:
          $ref: "#/components/schemas/FeeRuleType"
        rate:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/FeeUnit"
        rounding:
          $ref: "#/components/schemas/FeeRounding"
        minimum:
          $ref: "#/components/schemas/Decimal"
        taxCategory:
          type: string
          minLength: 1
          maxLength: 40
          description: Defaults to FIRING_SERVICE.

    FeeQuote:
      type: object
      required: [amount, scheduleVersion, taxCategory, breakdown]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        scheduleVersion:
          type: integer
          format: int32
        taxCategory:
          type: string
        breakdown:
          type: string
          description: The working, for example `12 × 10 × 8 in → 960 in³ × 0.05 = 48.00`.

    PiecePolicy:
      type: object
      required: [holdDays]
      properties:
        holdDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: How many days a ready piece is held before it becomes unclaimed.

    PieceStage:
      type: string
      enum: [RECEIVED, BISQUE_FIRED, GLAZED, READY, PICKED_UP, UNCLAIMED, DISPOSED]

    PieceFee:
      type: object
      description: The fee as priced at intake. Later fee changes don't alter it.
      required: [amount, breakdown]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        scheduleVersion:
          type: integer
          format: int32
          description: Absent when the studio had no fee schedule yet.
        taxCategory:
          type: string
        breakdown:
          type: string

    PieceEvent:
      type: object
      required: [to, occurredAt]
      properties:
        from:
          $ref: "#/components/schemas/PieceStage"
        to:
          $ref: "#/components/schemas/PieceStage"
        note:
          type: string
        actorAccountId:
          type: string
          format: uuid
          description: Absent when the system made the change, such as a hold running out.
        actorName:
          type: string
        occurredAt:
          type: string
          format: date-time

    PiecePhoto:
      type: object
      required: [id, url, thumbnailUrl, uploadedByAccountId, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: |
            The photo, readable for at least an hour without a bearer token. The URL stays the
            same within each hour, so it caches.
        thumbnailUrl:
          type: string
          format: uri
          description: A small version for lists, readable like `url`.
        uploadedByAccountId:
          type: string
          format: uuid
        uploadedAt:
          type: string
          format: date-time

    PhotoUpload:
      type: object
      required: [photoId, photoUploadUrl, thumbnailUploadUrl, expiresAt, maxPhotoBytes, maxThumbnailBytes]
      properties:
        photoId:
          type: string
          format: uuid
        photoUploadUrl:
          type: string
          format: uri
          description: "`PUT` the photo here, as a JPEG."
        thumbnailUploadUrl:
          type: string
          format: uri
          description: "`PUT` the thumbnail here, as a JPEG."
        expiresAt:
          type: string
          format: date-time
        maxPhotoBytes:
          type: integer
          format: int32
        maxThumbnailBytes:
          type: integer
          format: int32

    Piece:
      type: object
      required: [id, number, makerAccountId, size, stage, fee, receivedAt, overdue, nextStages, version, photos, timeline]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
          description: The studio's own running number, for labels ("piece 42").
        makerAccountId:
          type: string
          format: uuid
        makerName:
          type: string
        description:
          type: string
        clayBody:
          type: string
        makerMark:
          type: string
        size:
          $ref: "#/components/schemas/PieceSize"
        stage:
          $ref: "#/components/schemas/PieceStage"
        fee:
          $ref: "#/components/schemas/PieceFee"
        receivedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
        holdUntil:
          type: string
          format: date-time
          description: The end of the hold, at the end of the studio's local day.
        overdue:
          type: boolean
          description: Ready and past its hold; it will shortly be marked unclaimed.
        nextStages:
          type: array
          description: Where staff can move it next.
          items:
            $ref: "#/components/schemas/PieceStage"
        version:
          type: integer
          format: int64
          description: Send back as `expectedVersion` when moving the piece.
        photos:
          type: array
          description: Oldest first. Lists carry only the first photo; fetching one piece gives them all.
          items:
            $ref: "#/components/schemas/PiecePhoto"
        timeline:
          type: array
          description: Empty in lists; filled when fetching one piece.
          items:
            $ref: "#/components/schemas/PieceEvent"

    IntakePieceRequest:
      type: object
      required: [size]
      properties:
        makerAccountId:
          type: string
          format: uuid
          description: Whose piece it is. Defaults to the caller; only staff may name someone else.
        description:
          type: string
          maxLength: 200
        clayBody:
          type: string
          maxLength: 80
        makerMark:
          type: string
          maxLength: 80
          description: The maker's stamp or initials on the foot, which identifies the piece on the shelf.
        size:
          $ref: "#/components/schemas/PieceSize"

    MovePieceRequest:
      type: object
      required: [to, expectedVersion]
      properties:
        to:
          $ref: "#/components/schemas/PieceStage"
        note:
          type: string
          maxLength: 500
        expectedVersion:
          type: integer
          format: int64

    KilnType:
      type: string
      enum: [ELECTRIC, GAS, WOOD, RAKU, OTHER]

    Kiln:
      type: object
      required: [id, name, kind, totalFirings, available, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        site:
          type: string
          description: Which of the studio's sites it is at, for studios with more than one.
        kind:
          $ref: "#/components/schemas/KilnType"
        maxPiecesPerMember:
          type: integer
          format: int32
          description: The queue rule "at most N pieces per member in one load". Absent for no cap.
        totalFirings:
          type: integer
          format: int32
          description: Firings so far. Maintenance tasks counted in firings read this.
        available:
          type: boolean
        downReason:
          type: string
        version:
          type: integer
          format: int64

    SaveKilnRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        site:
          type: string
          maxLength: 60
        kind:
          $ref: "#/components/schemas/KilnType"
        maxPiecesPerMember:
          type: integer
          format: int32
          minimum: 1
          maximum: 500

    UpdateKilnRequest:
      type: object
      required: [kiln, expectedVersion]
      properties:
        kiln:
          $ref: "#/components/schemas/SaveKilnRequest"
        expectedVersion:
          type: integer
          format: int64

    KilnAvailabilityRequest:
      type: object
      required: [expectedVersion]
      properties:
        downReason:
          type: string
          maxLength: 200
          description: Why it is out of service. Leave out to put the kiln back in service.
        expectedVersion:
          type: integer
          format: int64

    AssetKind:
      type: string
      enum: [KILN, WHEEL, PUG_MILL, SLAB_ROLLER, EXTRUDER, CLAY_TRAP, SPRAY_BOOTH, VENTILATION, BUILDING, SAFETY, OTHER]

    Asset:
      type: object
      required: [id, kind, name, available, version, tasks]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AssetKind"
        name:
          type: string
          description: For a kiln, the kiln's name.
        kilnId:
          type: string
          format: uuid
          description: Present for a kiln.
        location:
          type: string
        notes:
          type: string
        available:
          type: boolean
        downReason:
          type: string
          description: Why it is out of service. For a kiln, the kiln's own reason.
        totalFirings:
          type: integer
          format: int32
          description: For a kiln, its firings so far.
        version:
          type: integer
          format: int64
        tasks:
          type: array
          description: Its recurring tasks, soonest due first.
          items:
            $ref: "#/components/schemas/MaintenanceTask"

    SaveAssetRequest:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/AssetKind"
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Peter Pugger VPM-20"]
        location:
          type: string
          maxLength: 80
        notes:
          type: string
          maxLength: 1000

    UpdateAssetRequest:
      type: object
      required: [expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        location:
          type: string
          maxLength: 80
        notes:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64

    AssetAvailabilityRequest:
      type: object
      required: [expectedVersion]
      properties:
        downReason:
          type: string
          maxLength: 200
          description: Why it is out of service. Absent puts it back in service.
        expectedVersion:
          type: integer
          format: int64

    DueStatus:
      type: string
      description: |
        DUE once the interval has passed. DUE_SOON within a tenth of the interval (at least a day
        or one firing, at most 14 days). OK otherwise.
      enum: [OK, DUE_SOON, DUE]

    MaintenanceTask:
      type: object
      required: [id, assetId, assetName, title, checklist, lastDoneAt, status, version]
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        assetName:
          type: string
        title:
          type: string
        checklist:
          type: array
          items:
            type: string
        everyDays:
          type: integer
          format: int32
        everyFirings:
          type: integer
          format: int32
        assignedDuty:
          $ref: "#/components/schemas/Duty"
        assignedTo:
          type: string
          format: uuid
        assignedToName:
          type: string
        lastDoneAt:
          type: string
          format: date-time
          description: When it was last done, or set up if it hasn't been yet.
        dueAt:
          type: string
          format: date-time
          description: When the days interval runs out. Absent without one.
        firingsLeft:
          type: integer
          format: int32
          description: Firings until the firings interval runs out; zero or less once due. Absent without one.
        status:
          $ref: "#/components/schemas/DueStatus"
        version:
          type: integer
          format: int64

    SaveMaintenanceTaskRequest:
      type: object
      required: [title]
      description: Needs everyDays, everyFirings or both. Assign it to a duty or a member, not both.
      properties:
        title:
          type: string
          minLength: 1
