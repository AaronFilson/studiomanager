openapi: 3.1.0
info:
  title: Studio Manager API
  version: 0.1.0
  description: |
    The HTTP contract for Studio Manager. This file is the source of truth: the Spring
    server interfaces (Gradle `openApiGenerate`) and the TypeScript client
    (`packages/api-client`) are both generated from it, so a change here fails the
    build on whichever side has not caught up.

    Errors use RFC 9457 problem details (`application/problem+json`).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: account
    description: The signed-in person.
  - name: studios
    description: Studios (tenants) and membership in them.
  - name: members
    description: The people in a studio, and invites.
  - name: fees
    description: Firing-fee schedules and quotes.
  - name: pieces
    description: Members' pieces from drop-off to pickup.
  - name: kilns
    description: Kilns, their queues, firings and maintenance.
  - name: notifications
    description: Members' inbox, and notices from staff.
  - name: access
    description: Duties (technician, monitor, work exchange…) and certifications on equipment.
  - name: schedule
    description: The studio calendar, the staffing roster, and credited hours.
  - name: today
    description: The handover view for whoever is running the studio today.
  - name: supplies
    description: Clay and supplies, stock on hand, reorder levels and purchase requests.
  - name: ledger
    description: |
      The studio's books: what members owe, prepaid balances, payouts from every provider,
      tax rates by date, and the daily summary that feeds QuickBooks or Xero.

paths:
  /api/v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in account and the studios it belongs to
      description: |
        The first call after sign-in. Creates the account record on first use, keyed by
        the token's issuer and subject.
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/studios:
    post:
      tags: [studios]
      operationId: createStudio
      summary: Create a studio, with the caller as its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudioRequest"
      responses:
        "201":
          description: The new studio.
          headers:
            Location:
              description: URL of the new studio.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Studio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/studios/{studioId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [studios]
      operationId: getStudio
      summary: A studio the caller belongs to
      responses:
        "200":
          description: The studio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Studio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/members:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [members]
      operationId: listMembers
      summary: Everyone in the studio (staff only)
      responses:
        "200":
          description: Members, owners first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/invites:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    post:
      tags: [members]
      operationId: createInvite
      summary: Invite someone into the studio (staff only)
      description: |
        Returns a one-time code, valid for 14 days. Nobody can invite to a role above their own.
        The code is shown only here; the server keeps just its hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/invites/{code}/accept:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 10
          maxLength: 64
    post:
      tags: [members]
      operationId: acceptInvite
      summary: Join a studio with an invite code
      responses:
        "200":
          description: The studio joined, and the role in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/fee-schedule:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [fees]
      operationId: getFeeSchedule
      summary: The current firing-fee schedule
      description: Version 0 means the studio hasn't set fees, so pieces fire free.
      responses:
        "200":
          description: The current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [fees]
      operationId: saveFeeSchedule
      summary: Save the fees as a new version (staff only)
      description: Earlier versions are kept, and pieces keep the version they were priced with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFeeScheduleRequest"
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/fee-quotes:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    post:
      tags: [fees]
      operationId: quoteFee
      summary: Price a piece without taking it in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PieceSize"
      responses:
        "200":
          description: The price, with the working shown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/piece-policy:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [pieces]
      operationId: getPiecePolicy
      summary: How long ready pieces are held
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiecePolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [pieces]
      operationId: savePiecePolicy
      summary: Change how long ready pieces are held (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiecePolicy"
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiecePolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/pieces:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [pieces]
      operationId: listPieces
      summary: Pieces, newest first
      description: Staff see every piece. Members see only their own, whatever the filter says.
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PieceStage"
        - name: maker
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Up to 500 pieces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Piece"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [pieces]
      operationId: intakePiece
      summary: Take in a piece
      description: |
        Numbers the piece and prices it with the current fee schedule. The fee is a snapshot:
        later fee changes don't alter it. Members can drop off only their own pieces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakePieceRequest"
      responses:
        "201":
          description: The new piece.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/pieces/{pieceId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/PieceId"
    get:
      tags: [pieces]
      operationId: getPiece
      summary: One piece and its timeline
      responses:
        "200":
          description: The piece.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/pieces/{pieceId}/moves:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/PieceId"
    post:
      tags: [pieces]
      operationId: movePiece
      summary: Move a piece to its next stage (staff only)
      description: Reaching READY starts the hold period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovePieceRequest"
      responses:
        "200":
          description: The piece after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/kilns:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [kilns]
      operationId: listKilns
      summary: The studio's kilns, with availability and maintenance counters
      responses:
        "200":
          description: Kilns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kiln"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [kilns]
      operationId: createKiln
      summary: Add a kiln (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveKilnRequest"
      responses:
        "201":
          description: The kiln.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiln"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/kilns/{kilnId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/KilnId"
    put:
      tags: [kilns]
      operationId: updateKiln
      summary: Change a kiln's settings (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKilnRequest"
      responses:
        "200":
          description: The kiln.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiln"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/kilns/{kilnId}/availability:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/KilnId"
    put:
      tags: [kilns]
      operationId: setKilnAvailability
      summary: Take a kiln out of service, or put it back (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KilnAvailabilityRequest"
      responses:
        "200":
          description: The kiln.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiln"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/kilns/{kilnId}/maintenance:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/KilnId"
    get:
      tags: [kilns]
      operationId: listKilnMaintenance
      summary: The kiln's maintenance log, newest first (staff only)
      responses:
        "200":
          description: Entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [kilns]
      operationId: recordKilnMaintenance
      summary: Log maintenance, which restarts the firings-since-maintenance count (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordMaintenanceRequest"
      responses:
        "200":
          description: The kiln afterwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiln"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/kilns/{kilnId}/queue:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/KilnId"
    get:
      tags: [kilns]
      operationId: getKilnQueue
      summary: Pieces waiting for a firing in this kiln, longest-waiting first (staff only)
      description: Each entry says whether the kiln's per-member cap lets it into the next load.
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FiringKind"
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/kilns/{kilnId}/firings:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/KilnId"
    get:
      tags: [kilns]
      operationId: listKilnFirings
      summary: The kiln's firing log, newest first (staff only)
      responses:
        "200":
          description: Firings, without their pieces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [kilns]
      operationId: loadKiln
      summary: Start a load from queued pieces (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoadKilnRequest"
      responses:
        "201":
          description: The new firing, loading.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/firings/{firingId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/FiringId"
    get:
      tags: [kilns]
      operationId: getFiring
      summary: One firing and its pieces (staff only)
      responses:
        "200":
          description: The firing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/firings/{firingId}/transitions:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/FiringId"
    post:
      tags: [kilns]
      operationId: transitionFiring
      summary: Start, unload or cancel a firing (staff only)
      description: |
        COMPLETE (unloading) moves every piece on (bisque → bisque fired; glaze → ready, which
        starts its hold), counts the firing against the kiln, and sends each maker one notice
        for the whole batch. CANCELLED returns the pieces to the queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FiringTransitionRequest"
      responses:
        "200":
          description: The firing afterwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Firing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/notifications:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [notifications]
      operationId: listMyNotifications
      summary: The caller's notifications in this studio, newest first
      responses:
        "200":
          description: Up to 100 notifications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/notifications/{notificationId}/read:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one of the caller's notifications as read
      responses:
        "204":
          description: Marked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/notices:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    post:
      tags: [notifications]
      operationId: sendNotice
      summary: Send every member a notice, such as a closure (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeRequest"
      responses:
        "200":
          description: How many members it went to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/duties:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [access]
      operationId: listDuties
      summary: Everyone's duties (staff only)
      responses:
        "200":
          description: Members who have at least one duty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberDuties"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/members/{accountId}/duties:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/AccountId"
    put:
      tags: [access]
      operationId: setDuties
      summary: Replace a member's duties (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDutiesRequest"
      responses:
        "200":
          description: The member's duties afterwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDuties"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/certification-types:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [access]
      operationId: listCertificationTypes
      summary: The certifications this studio gives
      responses:
        "200":
          description: Types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CertificationType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      operationId: createCertificationType
      summary: Add a kind of certification, such as "Kiln loading" (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificationTypeRequest"
      responses:
        "201":
          description: The type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificationType"
        "400":
          $ref: "#/components/responses/BadRequest"
