        amount:
          $ref: "#/components/schemas/Decimal"
        provider:
          $ref: "#/components/schemas/Provider"
        expiresOn:
          type: string
          format: date

    UseStoredValueRequest:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Decimal"

    StoredValueMovement:
      type: object
      required: [kind, opening, sold, used, expired, closing]
      properties:
        kind:
          $ref: "#/components/schemas/StoredValueKind"
        opening:
          $ref: "#/components/schemas/SignedDecimal"
        sold:
          $ref: "#/components/schemas/SignedDecimal"
        used:
          $ref: "#/components/schemas/SignedDecimal"
        expired:
          $ref: "#/components/schemas/SignedDecimal"
        closing:
          $ref: "#/components/schemas/SignedDecimal"

    Payout:
      type: object
      required: [id, provider, externalId, arrivalOn, gross, refunds, fees, adjustments, net, currency]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Provider"
        externalId:
          type: string
        arrivalOn:
          type: string
          format: date
        gross:
          $ref: "#/components/schemas/SignedDecimal"
        refunds:
          $ref: "#/components/schemas/SignedDecimal"
        fees:
          $ref: "#/components/schemas/SignedDecimal"
        adjustments:
          $ref: "#/components/schemas/SignedDecimal"
        net:
          $ref: "#/components/schemas/SignedDecimal"
        currency:
          $ref: "#/components/schemas/Currency"

    ImportPayoutRequest:
      type: object
      required: [provider, externalId, arrivalOn, gross, refunds, fees, adjustments, net]
      properties:
        provider:
          $ref: "#/components/schemas/PayoutProvider"
        externalId:
          type: string
          minLength: 1
          maxLength: 120
          description: The processor's own id for the payout, such as po_1Nz… from Stripe.
        arrivalOn:
          type: string
          format: date
        gross:
          $ref: "#/components/schemas/SignedDecimal"
        refunds:
          $ref: "#/components/schemas/Decimal"
        fees:
          $ref: "#/components/schemas/Decimal"
        adjustments:
          $ref: "#/components/schemas/SignedDecimal"
        net:
          $ref: "#/components/schemas/SignedDecimal"

    ClearingBalance:
      type: object
      required: [provider, awaitingPayout]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        awaitingPayout:
          $ref: "#/components/schemas/SignedDecimal"

    SummaryLine:
      type: object
      required: [date, account, debits, credits]
      properties:
        date:
          type: string
          format: date
        account:
          $ref: "#/components/schemas/LedgerAccount"
        taxCategory:
          type: string
        debits:
          $ref: "#/components/schemas/SignedDecimal"
        credits:
          $ref: "#/components/schemas/SignedDecimal"

    TaxRate:
      type: object
      required: [id, taxCategory, rate, effectiveFrom]
      properties:
        id:
          type: string
          format: uuid
        taxCategory:
          type: string
        rate:
          type: string
          description: A fraction, such as `"0.0825"` for 8.25%.
        effectiveFrom:
          type: string
          format: date

    SetTaxRateRequest:
      type: object
      required: [taxCategory, rate, effectiveFrom]
      properties:
        taxCategory:
          type: string
          minLength: 1
          maxLength: 40
          examples: [FIRING_SERVICE]
        rate:
          type: string
          pattern: "^0(\\.\\d{1,6})?$"
        effectiveFrom:
          type: string
          format: date

    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
