      type: object
      description: Present when the kind is MAINTENANCE_TASK.
      required: [assetId, title]
      properties:
        assetId:
          type: string
          format: uuid
        title:
          type: string
        everyDays:
          type: integer
          format: int32
        everyFirings:
          type: integer
          format: int32

