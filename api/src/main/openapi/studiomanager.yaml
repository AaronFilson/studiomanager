          application/json:
            schema:
              $ref: "#/components/schemas/DecidePurchaseRequest"
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/activity/weekly:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [activity]
      operationId: getWeeklyActivity
      summary: Weekly totals built from the event stream, newest week first (staff only)
      description: >
        Firings by kiln, pieces fired, members joined and fees charged, per week starting Monday in
        the studio's time zone. Built by a consumer of the Kafka event stream, so it is empty while
        streaming is off (`streaming` is false) and can lag the studio by a few seconds.
      parameters:
        - name: weeks
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 12
      responses:
        "200":
          description: The weeks that had any activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyActivity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/webhooks/event-types:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [webhooks]
      operationId: listWebhookEventTypes
      summary: The events an endpoint can subscribe to, each with an example payload (staff only)
      responses:
        "200":
          description: The event types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEventTypeInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/webhooks/endpoints:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [webhooks]
      operationId: listWebhookEndpoints
      summary: Where the studio's webhooks go (staff only)
      responses:
        "200":
          description: The endpoints, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [webhooks]
      operationId: createWebhookEndpoint
      summary: Add an endpoint (staff only)
      description: |
        The URL must be https and resolve only to public addresses. The response carries the
        signing secret, which is never shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookEndpoint"
      responses:
        "201":
          description: The endpoint and its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/webhooks/endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/EndpointId"
    patch:
      tags: [webhooks]
      operationId: updateWebhookEndpoint
      summary: Change an endpoint, or turn it off or back on (staff only)
      description: Turning an endpoint back on clears its failures. Events missed while it was off aren't replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookEndpoint"
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [webhooks]
      operationId: deleteWebhookEndpoint
      summary: Delete an endpoint and its delivery log (staff only)
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/webhooks/endpoints/{endpointId}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/EndpointId"
    post:
      tags: [webhooks]
      operationId: rotateWebhookSecret
      summary: A new signing secret (staff only)
      description: The old secret keeps signing, alongside the new one, for 24 hours.
      responses:
        "200":
          description: The new secret, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/webhooks/endpoints/{endpointId}/test:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/EndpointId"
    post:
      tags: [webhooks]
      operationId: testWebhookEndpoint
      summary: Send a ping now and return how it went (staff only)
      responses:
        "200":
          description: The delivery, with its one attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/webhooks/endpoints/{endpointId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/EndpointId"
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: The last 30 days of deliveries to an endpoint, newest first (staff only)
      responses:
        "200":
          description: >-
            Up to 500 deliveries, each with its attempts, with `truncated` set when there were
            more.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/webhooks/deliveries/{deliveryId}/resend:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [webhooks]
      operationId: resendWebhookDelivery
      summary: Send the same event again, now (staff only)
      description: A new delivery with the same event id, so a receiver that saw it already can drop it.
      responses:
        "200":
          description: The new delivery, with its attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/glazes:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [glazes]
      operationId: listGlazes
      summary: The glaze book
      description: |
        Studio glazes, the caller's own recipes, or recipes other members have shared. A
        member's unshared recipe is never listed for anyone else, staff included.
      parameters:
        - name: owner
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/GlazeListFilter"
      responses:
        "200":
          description: The recipes, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlazeRecipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [glazes]
      operationId: createGlaze
      summary: Add a recipe
      description: Anyone can add their own recipe. Only staff can add a studio glaze.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveGlazeRequest"
      responses:
        "201":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlazeRecipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/glazes/{glazeId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/GlazeId"
    get:
      tags: [glazes]
      operationId: getGlaze
      summary: One recipe
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlazeRecipe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [glazes]
      operationId: updateGlaze
      summary: Change a recipe (its owner, or staff for a studio glaze)
      description: Replaces the recipe and its lines. The owner kind can't change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveGlazeRequest"
      responses:
        "200":
          description: The recipe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlazeRecipe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [glazes]
      operationId: deleteGlaze
      summary: Delete a recipe (its owner, or staff for a studio glaze)
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/glazes/{glazeId}/batch:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/GlazeId"
    get:
      tags: [glazes]
      operationId: getGlazeBatch
      summary: The recipe scaled to a dry batch, ready to weigh out
      description: |
        Base lines share the batch size. Percent additions go on top, as a percent of the
        size; gram additions stay fixed. Weights are rounded for the scale: grams to 0.1,
        kilograms and pounds to 0.001, ounces to 0.01.
      parameters:
        - name: size
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Decimal"
        - name: unit
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/WeightUnit"
      responses:
        "200":
          description: The batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlazeBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/api-tokens:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [api-tokens]
      operationId: listApiTokens
      summary: The caller's API tokens; an owner sees everyone's (staff only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The tokens, newest first, including revoked and expired ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [api-tokens]
      operationId: createApiToken
      summary: Make a token that acts as the caller in this studio (staff only)
      description: The response carries the token itself, which is never shown again.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiTokenRequest"
      responses:
        "201":
          description: The token and its secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/api-tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [api-tokens]
      operationId: revokeApiToken
      summary: Revoke a token, at once (its owner, or the studio owner)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/pending-actions:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [pending-actions]
      operationId: listPendingActions
      summary: Assistant suggestions waiting for a decision, oldest first (staff only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The waiting suggestions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingActionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/pending-actions/{actionId}/decision:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [pending-actions]
      operationId: decidePendingAction
      summary: Approve or reject a suggestion (staff only)
      description: |
        Approving makes the change as the caller, with the same checks as making it by hand. If
        that fails, nothing changes and the suggestion stays waiting.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecidePendingActionRequest"
      responses:
        "200":
          description: The decided suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/ai-key:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [ai]
      operationId: getAiKey
      summary: The studio's own AI key, without the key itself (owner only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The key's provider, last four characters and whether it works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKeyStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [ai]
      operationId: setAiKey
      summary: Save the studio's own AI key, replacing any before it (owner only)
      description: |
        The key is stored encrypted and never returned. Saving it doesn't send anything
        anywhere; "test" does.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAiKeyRequest"
      responses:
        "200":
          description: The saved key's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKeyStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [ai]
      operationId: deleteAiKey
      summary: Delete the studio's AI key (owner only)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/ai-key/test:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    post:
      tags: [ai]
      operationId: testAiKey
      summary: Check the key with one small call to the provider (owner only)
      description: Lists the provider's models, which spends no tokens.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The key's status after the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiKeyStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/invoices:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [invoices]
      operationId: listInvoices
      summary: The supplies inbox, newest first (staff)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Invoices, without their lines.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [invoices]
      operationId: startInvoiceUpload
      summary: Start an invoice and get a URL to upload its file to (staff)
      description: |
        PUT the file to `uploadUrl` with `x-ms-blob-type: BlockBlob`, then call `complete`. The
        file is a PDF, JPEG or PNG of up to `maxBytes`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInvoiceUploadRequest"
      responses:
        "201":
          description: Where to upload the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/invoices/{invoiceId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [invoices]
      operationId: getInvoice
      summary: An invoice's draft, its checks, and a link to its file (staff)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [invoices]
      operationId: saveInvoiceDraft
      summary: Replace the draft with staff's corrections (staff)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInvoiceDraftRequest"
      responses:
        "200":
          description: The invoice, checked again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [invoices]
      operationId: discardInvoice
      summary: Throw away an invoice that hasn't been confirmed, and its file (staff)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/invoices/{invoiceId}/complete:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [invoices]
      operationId: completeInvoiceUpload
      summary: Check the uploaded file and have it read (staff)
      description: |
        The file is read in the background, so the invoice comes back `READING`. Poll it until it's
        `READY` or `NEEDS_LOOK`. Completing twice is harmless.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted; being read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/invoices/{invoiceId}/compare-readers:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [invoices]
      operationId: compareInvoiceReaders
      summary: Read the invoice with every reader allowed for the studio, side by side (owner)
      description: |
        Runs each reader the studio may use now, one after another, and returns what each read,
        how long it took and what it cost. The invoice's own draft doesn't change. Platform-paid
        runs count toward the month's page caps. Waits for every reader, so it can take a minute.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: One result per reader, in the studio's order. Empty when none may read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderComparison"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/invoices/{invoiceId}/confirm:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [invoices]
      operationId: confirmInvoice
      summary: Receive the invoice's stock (staff)
      description: |
        Each line with a supply item is received into stock at its quantity, and what the vendor's
        lines meant is remembered for its next invoice. Nothing reaches stock before this.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmInvoiceRequest"
      responses:
        "200":
          description: The confirmed invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token from Microsoft Entra External ID for the Studio Manager API.
    apiToken:
      type: http
      scheme: bearer
      description: |
        A personal API token (`smpat_...`), made under Settings by a staff member. It works only
        in its own studio and within its scopes.

  parameters:
    StudioId:
      name: studioId
      in: path
      required: true
      description: The studio (tenant). Every studio-scoped route starts with it.
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PieceId:
      name: pieceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KilnId:
      name: kilnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FiringId:
      name: firingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShiftId:
      name: shiftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoredValueId:
      name: storedValueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayeeId:
      name: payeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EndpointId:
      name: endpointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GlazeId:
      name: glazeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Year:
      name: year
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 2000
        maximum: 2100
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date
    From:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time

  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No valid access token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller is not a member of the studio, or lacks the role required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such thing, or not one the caller may see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Someone else changed it at the same time. Reload and try again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    RateLimitValues:
      type: object
      description: One bucket's limits.
      required: [burst, refillTokens, refillPeriodSeconds, dailyCap]
      properties:
        burst:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: Calls that can be made at once, without waiting.
        refillTokens:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: Calls given back each refill period.
        refillPeriodSeconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 3600
        dailyCap:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000000
          description: Calls a day, however they're spread.

    ChannelRateLimits:
      type: object
      description: The limits for MCP tool calls and for API token calls.
      required: [mcp, token]
      properties:
        mcp:
          $ref: "#/components/schemas/RateLimitValues"
        token:
          $ref: "#/components/schemas/RateLimitValues"

    BoostStep:
      type: object
      required: [kind, startsAt, endsAt]
      properties:
        kind:
          type: string
          enum: [UNLIMITED, EASING]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        multiplier:
          type: integer
          format: int32
          description: For an easing step, how many times the normal limits apply.

    RateLimitBoost:
      type: object
      required: [startsAt, endsAt, unlimitedMinutes, easingMinutes, steps]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        studioId:
          type: string
          format: uuid
          description: The one studio it lifts. Absent when it lifts every studio.
        studioName:
          type: string
          description: That studio's name.
        unlimitedMinutes:
          type: integer
          format: int32
        easingMinutes:
          type: integer
          format: int32
        steps:
          type: array
          items:
            $ref: "#/components/schemas/BoostStep"

    RateLimitOverview:
      type: object
      required: [now, defaults, normal]
      properties:
        now:
          type: string
          format: date-time
          description: The server's time, to describe the boost against.
        defaults:
          $ref: "#/components/schemas/ChannelRateLimits"
        override:
          $ref: "#/components/schemas/ChannelRateLimits"
        normal:
          $ref: "#/components/schemas/ChannelRateLimits"
        boost:
          $ref: "#/components/schemas/RateLimitBoost"

    ScheduleBoostRequest:
      type: object
      required: [unlimitedMinutes, easingMinutes]
      properties:
        startsAt:
          type: string
          format: date-time
          description: When it starts, up to 30 days ahead. Now if absent or past.
        studioId:
          type: string
          format: uuid
          description: Lift only this studio. Every studio if absent.
        unlimitedMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 240
        easingMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 240

    AdminStudio:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    SettingChange:
      type: object
      required: [key, version, changedById, changedAt]
      properties:
        key:
          type: string
        version:
          type: integer
          format: int64
        oldValue:
          type: object
          additionalProperties: true
          description: Absent when there was no override.
        newValue:
          type: object
          additionalProperties: true
          description: Absent when the change went back to the default.
        changedById:
          type: string
          format: uuid
        changedByName:
          type: string
        changedAt:
          type: string
          format: date-time

    Me:
      type: object
      required: [account, memberships]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        platformAdmin:
          type: boolean
          description: Whether this person has the Platform.Admin app role, for the admin page.

    Account:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          description: From the token's `name` claim, when the identity provider sends one.
        email:
          type: string
          description: From the token's `email` claim, when the identity provider sends one.

    Membership:
      type: object
      required: [studio, role]
      properties:
        studio:
          $ref: "#/components/schemas/StudioSummary"
        role:
          $ref: "#/components/schemas/StudioRole"

    StudioSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Studio:
      type: object
      required: [id, name, unitSystem, timeZone, country, currency, myRole, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        unitSystem:
          $ref: "#/components/schemas/UnitSystem"
        timeZone:
          type: string
          description: IANA time zone ID, for example `America/Chicago`.
          examples: [America/Chicago]
        country:
          $ref: "#/components/schemas/Country"
        currency:
          $ref: "#/components/schemas/Currency"
        myRole:
          $ref: "#/components/schemas/StudioRole"
        memberCount:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          type: string
          format: date-time

    CreateStudioRequest:
      type: object
      required: [name, unitSystem, timeZone, country]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        unitSystem:
          $ref: "#/components/schemas/UnitSystem"
        timeZone:
          type: string
          maxLength: 64
          description: IANA time zone ID. Web clients send the browser's zone.
          examples: [America/Chicago]
        country:
          $ref: "#/components/schemas/Country"
        currency:
          $ref: "#/components/schemas/Currency"

    Country:
      type: string
      description: |
        Where the studio operates, as an ISO 3166-1 alpha-2 code. Drives sales tax, the
        default currency and which accounting integrations are offered.
      pattern: "^[A-Z]{2}$"
      examples: [US]

    Currency:
      type: string
      description: |
        The studio's currency, as an ISO 4217 code. On create it defaults to the country's
        currency. All of the studio's money is kept in it.
      pattern: "^[A-Z]{3}$"
      examples: [USD]

    StudioRole:
      type: string
      description: |
        The base role in a studio. OWNER administers the studio's account (for a co-op or
        nonprofit, whoever holds that responsibility), STAFF help run it, MEMBER makes pots.
        Duties such as technician or monitor, and certifications on equipment, are granted
        separately on top of a role.
      enum: [OWNER, STAFF, MEMBER]

    UnitSystem:
      type: string
      description: The studio's default display units. Measurements are always stored in SI.
      enum: [US_CUSTOMARY, METRIC]

    Member:
      type: object
      required: [accountId, role, joinedAt]
      properties:
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/StudioRole"
        joinedAt:
          type: string
          format: date-time

    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/StudioRole"

    Invite:
      type: object
      required: [id, code, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Share this with the invitee. It is shown only once.
        role:
          $ref: "#/components/schemas/StudioRole"
        expiresAt:
          type: string
          format: date-time

    OpenInvite:
      type: object
      required: [id, role, createdAt, expiresAt, expired]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          description: Who it was emailed to. Absent for a link invite.
        role:
          $ref: "#/components/schemas/StudioRole"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        expired:
          type: boolean
        lastSentAt:
          type: string
          format: date-time
          description: When the email last went out. Absent until it has, and for link invites.

    EmailInvitesRequest:
      type: object
      required: [text, role]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
          description: Email addresses, separated by commas, semicolons, spaces or new lines.
        role:
          $ref: "#/components/schemas/StudioRole"

    EmailInvitesResult:
      type: object
      required: [invited, skipped]
      properties:
        invited:
          type: array
          items:
            $ref: "#/components/schemas/OpenInvite"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/SkippedEmail"

    SkippedEmail:
      type: object
      required: [email, reason]
      properties:
        email:
          type: string
        reason:
          type: string
          description: |
            ALREADY_MEMBER: someone in the studio signs in with this address. ALREADY_INVITED: it
            has an unexpired invite; resend that one instead.
          enum: [ALREADY_MEMBER, ALREADY_INVITED]

    Decimal:
      type: string
      description: A non-negative decimal, as a string so no precision is lost (for example `"0.05"`).
      pattern: "^\\d{1,9}(\\.\\d{1,4})?$"
      examples: ["0.05"]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: The amount at the currency's minor-unit scale, for example `"48.00"`.
          examples: ["48.00"]
        currency:
          $ref: "#/components/schemas/Currency"

    LengthUnit:
      type: string
      enum: [MILLIMETRE, CENTIMETRE, INCH]

    WeightUnit:
      type: string
      enum: [GRAM, KILOGRAM, POUND, OUNCE]

    Dimensions:
      type: object
      description: The piece's bounding box, in the unit it was measured in.
      required: [length, width, height, unit]
      properties:
        length:
          $ref: "#/components/schemas/Decimal"
        width:
          $ref: "#/components/schemas/Decimal"
        height:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/LengthUnit"

    WeightMeasure:
      type: object
      required: [value, unit]
      properties:
        value:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/WeightUnit"

    PieceSize:
      type: object
      description: What was measured. A studio pricing by volume needs dimensions; by weight, the weight.
      properties:
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        weight:
          $ref: "#/components/schemas/WeightMeasure"

    FeeRuleType:
      type: string
      description: PER_VOLUME prices the bounding box, PER_WEIGHT the weight, FLAT every piece the same.
      enum: [PER_VOLUME, PER_WEIGHT, FLAT]

    FeeUnit:
      type: string
      description: The unit the rate is per. Volume units for PER_VOLUME, weight units for PER_WEIGHT, none for FLAT.
      enum: [CUBIC_INCH, CUBIC_CENTIMETRE, LITRE, POUND, KILOGRAM]

    FeeRounding:
      type: string
      description: |
        How each dimension (or the weight) is rounded up, in the rule's own unit, before pricing.
        WHOLE_UNIT is "round each side up to the next whole inch".
      enum: [NONE, HALF_UNIT, WHOLE_UNIT]

    FeeSchedule:
      type: object
      required: [version, ruleType, rate, rounding, minimum, taxCategory]
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        ruleType:
          $ref: "#/components/schemas/FeeRuleType"
        rate:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/FeeUnit"
        rounding:
          $ref: "#/components/schemas/FeeRounding"
        minimum:
          $ref: "#/components/schemas/Decimal"
        taxCategory:
          type: string

    SaveFeeScheduleRequest:
      type: object
      required: [ruleType, rate, rounding, minimum]
      properties:
        ruleType:
          $ref: "#/components/schemas/FeeRuleType"
        rate:
          $ref: "#/components/schemas/Decimal"
        unit:
          $ref: "#/components/schemas/FeeUnit"
        rounding:
          $ref: "#/components/schemas/FeeRounding"
        minimum:
          $ref: "#/components/schemas/Decimal"
        taxCategory:
          type: string
          minLength: 1
          maxLength: 40
          description: Defaults to FIRING_SERVICE.

    FeeQuote:
      type: object
      required: [amount, scheduleVersion, taxCategory, breakdown]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        scheduleVersion:
          type: integer
          format: int32
        taxCategory:
          type: string
        breakdown:
          type: string
          description: The working, for example `12 × 10 × 8 in → 960 in³ × 0.05 = 48.00`.

    PiecePolicy:
      type: object
      required: [holdDays]
      properties:
        holdDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
          description: How many days a ready piece is held before it becomes unclaimed.

    ActorKind:
      type: string
      enum: [PERSON, SYSTEM]
      description: Whether a person or a background job did it (ADR 16).

    PieceStage:
      type: string
      enum: [RECEIVED, BISQUE_FIRED, GLAZED, READY, PICKED_UP, UNCLAIMED, DISPOSED]

    PieceFee:
      type: object
      description: The fee as priced at intake. Later fee changes don't alter it.
      required: [amount, breakdown]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        scheduleVersion:
          type: integer
          format: int32
          description: Absent when the studio had no fee schedule yet.
        taxCategory:
          type: string
        breakdown:
          type: string

    PieceEvent:
      type: object
      required: [to, actorKind, occurredAt]
      properties:
        from:
          $ref: "#/components/schemas/PieceStage"
        to:
          $ref: "#/components/schemas/PieceStage"
        note:
          type: string
        actorAccountId:
          type: string
          format: uuid
          description: >-
            The person, or the background job's own account, that made the change. Absent only on
            older changes a job made before jobs had accounts.
        actorName:
          type: string
          description: 'For a job, its name, such as "System: unclaimed pieces".'
        actorKind:
          $ref: "#/components/schemas/ActorKind"
        viaToken:
          type: string
          description: >-
            The name of the personal API token the person made the change through, by REST or an
            MCP tool, so it reads "Olive via Sync script". Absent when they used the app. A revoked
            token still shows its name.
        occurredAt:
          type: string
          format: date-time

    PiecePhoto:
      type: object
      required: [id, url, thumbnailUrl, uploadedByAccountId, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          description: |
            The photo, readable for at least an hour without a bearer token. The URL stays the
            same within each hour, so it caches.
        thumbnailUrl:
          type: string
          format: uri
          description: A small version for lists, readable like `url`.
        uploadedByAccountId:
          type: string
          format: uuid
        uploadedAt:
          type: string
          format: date-time

    PhotoUpload:
      type: object
      required: [photoId, photoUploadUrl, thumbnailUploadUrl, expiresAt, maxPhotoBytes, maxThumbnailBytes]
      properties:
        photoId:
          type: string
          format: uuid
        photoUploadUrl:
          type: string
          format: uri
          description: "`PUT` the photo here, as a JPEG."
        thumbnailUploadUrl:
          type: string
          format: uri
          description: "`PUT` the thumbnail here, as a JPEG."
        expiresAt:
          type: string
          format: date-time
        maxPhotoBytes:
          type: integer
          format: int32
        maxThumbnailBytes:
          type: integer
          format: int32

    Piece:
      type: object
      required: [id, number, makerAccountId, size, stage, fee, receivedAt, overdue, nextStages, version, photos, timeline]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          format: int32
          description: The studio's own running number, for labels ("piece 42").
        makerAccountId:
          type: string
          format: uuid
        makerName:
          type: string
        description:
          type: string
        clayBody:
          type: string
        makerMark:
          type: string
        size:
          $ref: "#/components/schemas/PieceSize"
        stage:
          $ref: "#/components/schemas/PieceStage"
        fee:
          $ref: "#/components/schemas/PieceFee"
        receivedAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
        holdUntil:
          type: string
          format: date-time
          description: The end of the hold, at the end of the studio's local day.
        overdue:
          type: boolean
          description: Ready and past its hold; it will shortly be marked unclaimed.
        nextStages:
          type: array
          description: Where staff can move it next.
          items:
            $ref: "#/components/schemas/PieceStage"
        version:
          type: integer
          format: int64
          description: Send back as `expectedVersion` when moving the piece.
        photos:
          type: array
          description: Oldest first. Lists carry only the first photo; fetching one piece gives them all.
          items:
            $ref: "#/components/schemas/PiecePhoto"
        timeline:
          type: array
          description: Empty in lists; filled when fetching one piece.
          items:
            $ref: "#/components/schemas/PieceEvent"

    IntakePieceRequest:
      type: object
      required: [size]
      properties:
        makerAccountId:
          type: string
          format: uuid
          description: Whose piece it is. Defaults to the caller; only staff may name someone else.
        description:
          type: string
          maxLength: 200
        clayBody:
          type: string
          maxLength: 80
        makerMark:
          type: string
          maxLength: 80
          description: The maker's stamp or initials on the foot, which identifies the piece on the shelf.
        size:
          $ref: "#/components/schemas/PieceSize"

    MovePieceRequest:
      type: object
      required: [to, expectedVersion]
      properties:
        to:
          $ref: "#/components/schemas/PieceStage"
        note:
          type: string
          maxLength: 500
        expectedVersion:
          type: integer
          format: int64

    KilnType:
      type: string
      enum: [ELECTRIC, GAS, WOOD, RAKU, OTHER]

    Kiln:
      type: object
      required: [id, name, kind, totalFirings, available, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        site:
          type: string
          description: Which of the studio's sites it is at, for studios with more than one.
        kind:
          $ref: "#/components/schemas/KilnType"
        maxPiecesPerMember:
          type: integer
          format: int32
          description: The queue rule "at most N pieces per member in one load". Absent for no cap.
        totalFirings:
          type: integer
          format: int32
          description: Firings so far. Maintenance tasks counted in firings read this.
        available:
          type: boolean
        downReason:
          type: string
        version:
          type: integer
          format: int64

    SaveKilnRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        site:
          type: string
          maxLength: 60
        kind:
          $ref: "#/components/schemas/KilnType"
        maxPiecesPerMember:
          type: integer
          format: int32
          minimum: 1
          maximum: 500

    UpdateKilnRequest:
      type: object
      required: [kiln, expectedVersion]
      properties:
        kiln:
          $ref: "#/components/schemas/SaveKilnRequest"
        expectedVersion:
          type: integer
          format: int64

    KilnAvailabilityRequest:
      type: object
      required: [expectedVersion]
      properties:
        downReason:
          type: string
          maxLength: 200
          description: Why it is out of service. Leave out to put the kiln back in service.
        expectedVersion:
          type: integer
          format: int64

    AssetKind:
      type: string
      enum: [KILN, WHEEL, PUG_MILL, SLAB_ROLLER, EXTRUDER, CLAY_TRAP, SPRAY_BOOTH, VENTILATION, BUILDING, SAFETY, OTHER]

    Asset:
      type: object
      required: [id, kind, name, available, version, tasks]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AssetKind"
        name:
          type: string
          description: For a kiln, the kiln's name.
        kilnId:
          type: string
          format: uuid
          description: Present for a kiln.
        location:
          type: string
        notes:
          type: string
        available:
          type: boolean
        downReason:
          type: string
          description: Why it is out of service. For a kiln, the kiln's own reason.
        totalFirings:
          type: integer
          format: int32
          description: For a kiln, its firings so far.
        version:
          type: integer
          format: int64
        tasks:
          type: array
          description: Its recurring tasks, soonest due first.
          items:
            $ref: "#/components/schemas/MaintenanceTask"

    SaveAssetRequest:
      type: object
      required: [kind, name]
      properties:
        kind:
          $ref: "#/components/schemas/AssetKind"
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Peter Pugger VPM-20"]
        location:
          type: string
          maxLength: 80
        notes:
          type: string
          maxLength: 1000

    UpdateAssetRequest:
      type: object
      required: [expectedVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        location:
          type: string
          maxLength: 80
        notes:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64

    AssetAvailabilityRequest:
      type: object
      required: [expectedVersion]
      properties:
        downReason:
          type: string
          maxLength: 200
          description: Why it is out of service. Absent puts it back in service.
        expectedVersion:
          type: integer
          format: int64

    DueStatus:
      type: string
      description: |
        DUE once the interval has passed. DUE_SOON within a tenth of the interval (at least a day
        or one firing, at most 14 days). OK otherwise.
      enum: [OK, DUE_SOON, DUE]

    MaintenanceTask:
      type: object
      required: [id, assetId, assetName, title, checklist, lastDoneAt, status, version]
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        assetName:
          type: string
        title:
          type: string
        checklist:
          type: array
          items:
            type: string
        everyDays:
          type: integer
          format: int32
        everyFirings:
          type: integer
          format: int32
        assignedDuty:
          $ref: "#/components/schemas/Duty"
        assignedTo:
          type: string
          format: uuid
        assignedToName:
          type: string
        lastDoneAt:
          type: string
          format: date-time
          description: When it was last done, or set up if it hasn't been yet.
        dueAt:
          type: string
          format: date-time
          description: When the days interval runs out. Absent without one.
        firingsLeft:
          type: integer
          format: int32
          description: Firings until the firings interval runs out; zero or less once due. Absent without one.
        status:
          $ref: "#/components/schemas/DueStatus"
        version:
          type: integer
          format: int64

    SaveMaintenanceTaskRequest:
      type: object
      required: [title]
      description: Needs everyDays, everyFirings or both. Assign it to a duty or a member, not both.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Check element resistance"]
        checklist:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 200
        everyDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
        everyFirings:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
        assignedDuty:
          $ref: "#/components/schemas/Duty"
        assignedTo:
          type: string
          format: uuid

    ReportableAsset:
      type: object
      required: [id, kind, name, available]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AssetKind"
        name:
          type: string
        available:
          type: boolean
          description: False while it's out of service, so a member knows it's already in hand.

    ProblemReport:
      type: object
      required: [id, description, reportedBy, reportedAt, open, version]
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          description: Absent for "somewhere else".
        assetName:
          type: string
        description:
          type: string
        reportedBy:
          type: string
          format: uuid
        reportedByName:
          type: string
        reportedAt:
          type: string
          format: date-time
        open:
          type: boolean
        resolvedByName:
          type: string
        resolvedAt:
          type: string
          format: date-time
        resolution:
          type: string
        version:
          type: integer
          format: int64

    ReportProblemRequest:
      type: object
      required: [description]
      properties:
        assetId:
          type: string
          format: uuid
          description: Leave out for something not on the list.
        description:
          type: string
          minLength: 1
          maxLength: 1000
          examples: ["Wheel 3 grinds when it speeds up"]

    ResolveProblemRequest:
      type: object
      required: [expectedVersion]
      properties:
        resolution:
          type: string
          maxLength: 1000
          examples: ["Replaced the belt"]
        expectedVersion:
          type: integer
          format: int64

    SuggestedMaintenanceTask:
      type: object
      required: [task, source]
      properties:
        task:
          $ref: "#/components/schemas/SaveMaintenanceTaskRequest"
        source:
          type: string
          description: Where the interval comes from, such as the kiln maker or a regulation.
          examples: ["L&L Kiln Mfg maintenance schedule"]

    UpdateMaintenanceTaskRequest:
      type: object
      required: [task, expectedVersion]
      properties:
        task:
          $ref: "#/components/schemas/SaveMaintenanceTaskRequest"
        expectedVersion:
          type: integer
          format: int64

    CompleteMaintenanceTaskRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
          examples: ["Elements read 11.2 Ω, within spec"]
        cost:
          $ref: "#/components/schemas/Decimal"
        checked:
          type: array
          description: The checklist lines that were done.
          maxItems: 30
          items:
            type: string
        parts:
          type: array
          maxItems: 20
          description: Spare parts taken from supplies, such as a new element. Staff only, as for any stock movement.
          items:
            $ref: "#/components/schemas/PartUse"

    RecordRepairRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000
          examples: ["Replaced the lid hinge pin"]
        cost:
          $ref: "#/components/schemas/Decimal"
        parts:
          type: array
          maxItems: 20
          description: Spare parts taken from supplies; each is recorded as used, so stock goes down.
          items:
            $ref: "#/components/schemas/PartUse"

    PartUse:
      type: object
      required: [itemId, quantity]
      properties:
        itemId:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Decimal"

    PartUsed:
      type: object
      required: [itemId, itemName, unit, quantity]
      properties:
        itemId:
          type: string
          format: uuid
        itemName:
          type: string
        unit:
          type: string
        quantity:
          $ref: "#/components/schemas/Decimal"

    MaintenanceRecord:
      type: object
      required: [id, assetId, checked, doneBy, doneAt, parts, photos]
      properties:
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
          description: Absent for work outside any task.
        taskTitle:
          type: string
        note:
          type: string
        cost:
          $ref: "#/components/schemas/Decimal"
        checked:
          type: array
          items:
            type: string
        atFiring:
          type: integer
          format: int32
          description: For a kiln, its total firings when the work was done.
        doneBy:
          type: string
          format: uuid
        doneByName:
          type: string
        viaToken:
          type: string
          description: >-
            The name of the personal API token the work was logged through, by REST or an MCP
            tool. Absent when it was logged in the app. A revoked token still shows its name.
        doneAt:
          type: string
          format: date-time
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartUsed"
        photos:
          type: array
          description: Finished photos, oldest first. Same shape as a piece's photos.
          items:
            $ref: "#/components/schemas/PiecePhoto"

    FiringKind:
      type: string
      description: BISQUE takes received greenware to bisque fired; GLAZE takes glazed work to ready.
      enum: [BISQUE, GLAZE]

    FiringStatus:
      type: string
      enum: [LOADING, FIRING, COMPLETE, CANCELLED]

    QueueEntry:
      type: object
      required: [piece, waitingSince, fitsNextLoad]
      properties:
        piece:
          $ref: "#/components/schemas/Piece"
        waitingSince:
          type: string
          format: date-time
        fitsNextLoad:
          type: boolean
          description: False when the maker already has the kiln's maximum earlier in the queue.

    Firing:
      type: object
      required: [id, kilnId, kilnName, kind, status, createdAt, pieceCount, version, pieces]
      properties:
        id:
          type: string
          format: uuid
        kilnId:
          type: string
          format: uuid
        kilnName:
          type: string
        kind:
          $ref: "#/components/schemas/FiringKind"
        cone:
          type: string
          examples: ["04"]
        status:
          $ref: "#/components/schemas/FiringStatus"
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        pieceCount:
          type: integer
          format: int32
        version:
          type: integer
          format: int64
        pieces:
          type: array
          description: Empty in the firing log; filled for one firing.
          items:
            $ref: "#/components/schemas/Piece"

    LoadKilnRequest:
      type: object
      required: [kind, pieceIds]
      properties:
        kind:
          $ref: "#/components/schemas/FiringKind"
        cone:
          type: string
          maxLength: 10
        pieceIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid

    FiringTransitionRequest:
      type: object
      required: [to, expectedVersion]
      properties:
        to:
          type: string
          enum: [FIRING, COMPLETE, CANCELLED]
        notes:
          type: string
          maxLength: 1000
        expectedVersion:
          type: integer
          format: int64

    NotificationKind:
      type: string
      enum: [PIECES_READY, STUDIO_NOTICE, MAINTENANCE_DUE, PROBLEM_REPORTED, SHIFT_COVER, WEBHOOK_DISABLED]

    Notification:
      type: object
      required: [id, kind, title, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NotificationKind"
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time

    NoticeRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          maxLength: 2000

    NoticeResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: integer
          format: int32

    Duty:
      type: string
      description: A job on top of a member's role.
      enum: [TECHNICIAN, MONITOR, WORK_EXCHANGE, VOLUNTEER_OFFICER, INSTRUCTOR]

    MemberDuties:
      type: object
      required: [accountId, duties]
      properties:
        accountId:
          type: string
          format: uuid
        duties:
          type: array
          items:
            $ref: "#/components/schemas/Duty"

    SetDutiesRequest:
      type: object
      required: [duties]
      properties:
        duties:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Duty"

    CertificationType:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        validMonths:
          type: integer
          format: int32
          description: How long a grant lasts. Absent means it doesn't expire.

    CreateCertificationTypeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          examples: ["Wheel room orientation"]
        validMonths:
          type: integer
          format: int32
          minimum: 1
          maximum: 120

    Certification:
      type: object
      required: [typeId, name, accountId, grantedAt, valid]
      properties:
        typeId:
          type: string
          format: uuid
        name:
          type: string
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        valid:
          type: boolean

    ResourceKind:
      type: string
      enum: [KILN, WHEEL_ROOM, GLAZE_ROOM, STUDIO, EQUIPMENT, OTHER]

    Resource:
      type: object
      required: [id, name, kind, capacity, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ResourceKind"
        capacity:
          type: integer
          format: int32
          description: How many members can reserve it at once.
        requiredCertification:
          type: string
          format: uuid
        requiredCertificationName:
          type: string
        assetId:
          type: string
          format: uuid
          description: The maintained asset this is, if any.
        downReason:
          type: string
          description: |
            Why that asset is out of service; absent when it's in service. While it is down, only
            MAINTENANCE and CLOSURE bookings can be made.
        version:
          type: integer
          format: int64

    CreateResourceRequest:
      type: object
      required: [name, kind, capacity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        kind:
          $ref: "#/components/schemas/ResourceKind"
        capacity:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        requiredCertification:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          description: A maintained asset (from the maintenance page) that this is, such as a kiln.

    BookingKind:
      type: string
      description: RESERVATION takes one place; the others block the whole resource.
      enum: [RESERVATION, FIRING, MAINTENANCE, CLASS, EVENT, RENTAL, CLOSURE]

    Booking:
      type: object
      required: [id, resourceId, resourceName, kind, title, startsAt, endsAt, mine]
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        resourceName:
          type: string
        kind:
          $ref: "#/components/schemas/BookingKind"
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        mine:
          type: boolean

    CreateBookingRequest:
      type: object
      required: [resourceId, kind, startsAt, endsAt]
      properties:
        resourceId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/BookingKind"
        title:
          type: string
          maxLength: 120
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          description: Who it is for. Defaults to the caller for reservations; only staff may name someone else.

    OfferShiftRequest:
      type: object
      required: [offered, expectedVersion]
      properties:
        offered:
          type: boolean
          description: True to ask for cover, false to stop asking.
        expectedVersion:
          type: integer
          format: int64

    Shift:
      type: object
      required: [id, title, startsAt, endsAt, open, offered, minutes, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        duty:
          $ref: "#/components/schemas/Duty"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        open:
          type: boolean
        offered:
          type: boolean
          description: Whoever has it is asking for cover; members who could work it can take it.
        minutes:
          type: integer
          format: int32
        workedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64

    CreateShiftsRequest:
      type: object
      required: [title, firstStartsAt, minutes, weeks]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Open studio monitor"]
        duty:
          $ref: "#/components/schemas/Duty"
        firstStartsAt:
          type: string
          format: date-time
        minutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 1440
        weeks:
          type: integer
          format: int32
          minimum: 1
          maximum: 26

    AssignShiftRequest:
      type: object
      required: [expectedVersion]
      properties:
        accountId:
          type: string
          format: uuid
          description: Who takes it. Leave out to free the shift (staff only).
        expectedVersion:
          type: integer
          format: int64

    VersionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          format: int64

    HoursEntry:
      type: object
      required: [id, minutes, creditedAt]
      properties:
        id:
          type: string
          format: uuid
        minutes:
          type: integer
          format: int32
        note:
          type: string
        shiftId:
          type: string
          format: uuid
        creditedAt:
          type: string
          format: date-time
        creditedByName:
          type: string

    HoursLedger:
      type: object
      required: [accountId, totalMinutes, entries, truncated, limit]
      properties:
        accountId:
          type: string
          format: uuid
        accountName:
          type: string
        totalMinutes:
          type: integer
          format: int32
          description: Every entry counts, including any past the limit.
        entries:
          type: array
          description: The newest entries, up to `limit`.
          items:
            $ref: "#/components/schemas/HoursEntry"
        truncated:
          type: boolean
          description: There were more entries than `limit`; only the newest are listed.
        limit:
          type: integer
          format: int32
          description: The most entries this list returns.

    AdjustHoursRequest:
      type: object
      required: [minutes, note]
      properties:
        minutes:
          type: integer
          format: int32
          minimum: -6000
          maximum: 6000
        note:
          type: string
          minLength: 1
          maxLength: 200

    Today:
      type: object
      required: [date, kilns, openFirings, waitingForBisque, waitingForGlaze, readyForPickup, pastHold, unclaimed,
                 maintenanceDue, outOfService, bookings, shifts, uncoveredShifts, lowStock, openPurchaseRequests,
                 openProblems]
      properties:
        date:
          type: string
          format: date
          description: Today, in the studio's time zone.
        kilns:
          type: array
          items:
            $ref: "#/components/schemas/Kiln"
        openFirings:
          type: array
          items:
            $ref: "#/components/schemas/Firing"
        waitingForBisque:
          type: integer
          format: int32
        waitingForGlaze:
          type: integer
          format: int32
        readyForPickup:
          type: integer
          format: int32
        pastHold:
          type: integer
          format: int32
        unclaimed:
          type: integer
          format: int32
        maintenanceDue:
          type: array
          description: Maintenance tasks due or due soon, on any asset, soonest first.
          items:
            $ref: "#/components/schemas/MaintenanceTask"
        outOfService:
          type: array
          items:
            $ref: "#/components/schemas/Kiln"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/Shift"
        uncoveredShifts:
          type: array
          description: Shifts in the next seven days that are open or whose holder asked for cover.
          items:
            $ref: "#/components/schemas/Shift"
        lowStock:
          type: array
          description: Items at or below their par level with nothing on order.
          items:
            $ref: "#/components/schemas/SupplyItem"
        openPurchaseRequests:
          type: integer
          format: int32
        openProblems:
          type: array
          description: Problems members reported that nobody has resolved, newest first.
          items:
            $ref: "#/components/schemas/ProblemReport"

    SupplyCategory:
      type: string
      enum: [CLAY, GLAZE, GLAZE_MATERIAL, TOOL, KILN_SUPPLY, CLEANING, OTHER]

    SupplyItem:
      type: object
      required: [id, name, category, unit, onHand, onOrder, low, needsOrdering, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: "#/components/schemas/SupplyCategory"
        unit:
          type: string
          examples: ["25 lb bag"]
        supplier:
          type: string
        leadTimeDays:
          type: integer
          format: int32
        parLevel:
          $ref: "#/components/schemas/Decimal"
        reorderQuantity:
          $ref: "#/components/schemas/Decimal"
        salePrice:
          $ref: "#/components/schemas/Decimal"
        taxCategory:
          type: string
        substitute:
          type: string
          description: What to tell members to use while this is out.
        onHand:
          $ref: "#/components/schemas/SignedDecimal"
        onOrder:
          $ref: "#/components/schemas/SignedDecimal"
        low:
          type: boolean
        needsOrdering:
          type: boolean
          description: Low, with nothing approved or ordered.
        version:
          type: integer
          format: int64

    SaveSupplyRequest:
      type: object
      required: [name, category, unit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: "#/components/schemas/SupplyCategory"
        unit:
          type: string
          minLength: 1
          maxLength: 30
        supplier:
          type: string
          maxLength: 80
        leadTimeDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 365
        parLevel:
          $ref: "#/components/schemas/Decimal"
        reorderQuantity:
          $ref: "#/components/schemas/Decimal"
        salePrice:
          $ref: "#/components/schemas/Decimal"
        taxCategory:
          type: string
          maxLength: 40
        substitute:
          type: string
          maxLength: 120

    UpdateSupplyRequest:
      type: object
      required: [item, expectedVersion]
      properties:
        item:
          $ref: "#/components/schemas/SaveSupplyRequest"
        expectedVersion:
          type: integer
          format: int64

    StockMovementKind:
      type: string
      enum: [RECEIVED, SOLD, USED, COUNTED]

    StockMovement:
      type: object
      required: [id, kind, quantity, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/StockMovementKind"
        quantity:
          $ref: "#/components/schemas/SignedDecimal"
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    StockMovementRequest:
      type: object
      required: [kind, quantity]
      properties:
        kind:
          type: string
          enum: [RECEIVED, USED, COUNTED]
        quantity:
          $ref: "#/components/schemas/Decimal"
        note:
          type: string
          maxLength: 200

    SellSupplyRequest:
      type: object
      required: [memberId, quantity]
      properties:
        memberId:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Decimal"

    PurchaseRequestStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, ORDERED, RECEIVED]

    PurchaseRequest:
      type: object
      required: [id, itemId, itemName, quantity, status, requestedBy, requestedAt, version]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        itemName:
          type: string
        quantity:
          $ref: "#/components/schemas/SignedDecimal"
        note:
          type: string
        status:
          $ref: "#/components/schemas/PurchaseRequestStatus"
        requestedBy:
          type: string
          format: uuid
        requestedByName:
          type: string
        requestedViaToken:
          type: string
          description: >-
            The name of the personal API token the request was made through, so it reads "Olive
            via Sync script". Absent when it was made in the app. A revoked token still shows its
            name.
        requestedAt:
          type: string
          format: date-time
        decidedByName:
          type: string
        decidedViaToken:
          type: string
          description: The name of the personal API token the approval or rejection came through.
        version:
          type: integer
          format: int64

    CreatePurchaseRequestRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string
          format: uuid
        quantity:
          $ref: "#/components/schemas/Decimal"
        note:
          type: string
          maxLength: 200

    DecidePurchaseRequest:
      type: object
      required: [to, expectedVersion]
      properties:
        to:
          type: string
          enum: [APPROVED, REJECTED, ORDERED, RECEIVED]
        expectedVersion:
          type: integer
          format: int64

    SignedDecimal:
      type: string
      description: A decimal that may be negative, as a string.
      pattern: "^-?\\d{1,12}(\\.\\d{1,4})?$"

    Provider:
      type: string
      description: Where money came from or went. CASH is the till.
      enum: [STRIPE, SQUARE, SHOPIFY, PAYPAL, CASH, OTHER]

    PayoutProvider:
      type: string
      enum: [STRIPE, SQUARE, SHOPIFY, PAYPAL, OTHER]

    StoredValueKind:
      type: string
      enum: [GIFT_CARD, FIRING_CARD, CLASS_PACK, DEPOSIT, CREDIT]

    LedgerAccount:
      type: string
      enum: [BANK, PROCESSOR_CLEARING, MEMBER_RECEIVABLE, STORED_VALUE_LIABILITY, SALES_TAX_PAYABLE, PAYEES_PAYABLE,
             REVENUE_FIRING, REVENUE_CLASSES, REVENUE_MEMBERSHIPS, REVENUE_RETAIL, REVENUE_EVENTS, REVENUE_BREAKAGE,
             REVENUE_COMMISSIONS, REVENUE_OTHER, REFUNDS, PROCESSOR_FEES, CONTRACT_SERVICES, OPENING_BALANCE_EQUITY]

    MemberBalance:
      type: object
      required: [memberId, owed]
      properties:
        memberId:
          type: string
          format: uuid
        memberName:
          type: string
        owed:
          $ref: "#/components/schemas/SignedDecimal"

    StoredValue:
      type: object
      required: [id, kind, remaining]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/StoredValueKind"
        holder:
          type: string
          format: uuid
        holderName:
          type: string
        code:
          type: string
          description: For gift cards, the code to redeem it.
        label:
          type: string
        expiresOn:
          type: string
          format: date
        remaining:
          $ref: "#/components/schemas/SignedDecimal"

    Statement:
      type: object
      required: [memberId, owed, storedValues]
      properties:
        memberId:
          type: string
          format: uuid
        owed:
          $ref: "#/components/schemas/SignedDecimal"
        storedValues:
          type: array
          items:
            $ref: "#/components/schemas/StoredValue"

    RecordPaymentRequest:
      type: object
      required: [memberId, amount, provider]
      properties:
        memberId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Decimal"
        provider:
          $ref: "#/components/schemas/Provider"
        reference:
          type: string
          maxLength: 80

    SellStoredValueRequest:
      type: object
      required: [kind, amount, provider]
      properties:
        kind:
          $ref: "#/components/schemas/StoredValueKind"
        holder:
          type: string
          format: uuid
          description: Who it belongs to. Required except for gift cards.
        label:
          type: string
          maxLength: 80
          examples: ["10-firing card"]
        amount:
          $ref: "#/components/schemas/Decimal"
        provider:
          $ref: "#/components/schemas/Provider"
        expiresOn:
          type: string
          format: date

    UseStoredValueRequest:
      type: object
      required: [memberId, amount]
      properties:
        memberId:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Decimal"

    StoredValueMovement:
      type: object
      required: [kind, opening, sold, used, expired, closing]
      properties:
        kind:
          $ref: "#/components/schemas/StoredValueKind"
        opening:
          $ref: "#/components/schemas/SignedDecimal"
        sold:
          $ref: "#/components/schemas/SignedDecimal"
        used:
          $ref: "#/components/schemas/SignedDecimal"
        expired:
          $ref: "#/components/schemas/SignedDecimal"
        closing:
          $ref: "#/components/schemas/SignedDecimal"

    Payout:
      type: object
      required: [id, provider, externalId, arrivalOn, gross, refunds, fees, adjustments, net, currency]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/Provider"
        externalId:
          type: string
        arrivalOn:
          type: string
          format: date
        gross:
          $ref: "#/components/schemas/SignedDecimal"
        refunds:
          $ref: "#/components/schemas/SignedDecimal"
        fees:
          $ref: "#/components/schemas/SignedDecimal"
        adjustments:
          $ref: "#/components/schemas/SignedDecimal"
        net:
          $ref: "#/components/schemas/SignedDecimal"
        currency:
          $ref: "#/components/schemas/Currency"

    ImportPayoutRequest:
      type: object
      required: [provider, externalId, arrivalOn, gross, refunds, fees, adjustments, net]
      properties:
        provider:
          $ref: "#/components/schemas/PayoutProvider"
        externalId:
          type: string
          minLength: 1
          maxLength: 120
          description: The processor's own id for the payout, such as po_1Nz… from Stripe.
        arrivalOn:
          type: string
          format: date
        gross:
          $ref: "#/components/schemas/SignedDecimal"
        refunds:
          $ref: "#/components/schemas/Decimal"
        fees:
          $ref: "#/components/schemas/Decimal"
        adjustments:
          $ref: "#/components/schemas/SignedDecimal"
        net:
          $ref: "#/components/schemas/SignedDecimal"

    ClearingBalance:
      type: object
      required: [provider, awaitingPayout]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        awaitingPayout:
          $ref: "#/components/schemas/SignedDecimal"

    SummaryLine:
      type: object
      required: [date, account, debits, credits]
      properties:
        date:
          type: string
          format: date
        account:
          $ref: "#/components/schemas/LedgerAccount"
        taxCategory:
          type: string
        debits:
          $ref: "#/components/schemas/SignedDecimal"
        credits:
          $ref: "#/components/schemas/SignedDecimal"

    TaxRate:
      type: object
      required: [id, taxCategory, rate, effectiveFrom]
      properties:
        id:
          type: string
          format: uuid
        taxCategory:
          type: string
        rate:
          type: string
          description: A fraction, such as `"0.0825"` for 8.25%.
        effectiveFrom:
          type: string
          format: date

    SetTaxRateRequest:
      type: object
      required: [taxCategory, rate, effectiveFrom]
      properties:
        taxCategory:
          type: string
          minLength: 1
          maxLength: 40
          examples: [FIRING_SERVICE]
        rate:
          type: string
          pattern: "^0(\\.\\d{1,6})?$"
        effectiveFrom:
          type: string
          format: date

    Share:
      type: string
      description: A fraction above 0 and up to 1, such as `"0.6"` for 60%.
      pattern: "^(0(\\.\\d{1,4})?|1(\\.0{1,4})?)$"
      examples: ["0.6"]

    DiscountsFrom:
      type: string
      description: |
        Who bears a discount on consigned work. SHARED splits the price paid by the shares;
        STUDIO pays the artist their share of the retail price, out of the studio's commission.
      enum: [SHARED, STUDIO]

    PaymentMethod:
      type: string
      description: |
        How a payee was paid. PAYPAL and STRIPE are payment networks, which report on a 1099-K,
        so they don't count towards a 1099-NEC. STUDIO_CREDIT pays a member-payee by taking it off
        what they owe the studio.
      enum: [CHECK, BANK_TRANSFER, CASH, PAYPAL, STRIPE, STUDIO_CREDIT]

    EarningKind:
      type: string
      enum: [CLASS_SHARE, SERVICE, ADJUSTMENT]

    Payee:
      type: object
      required: [id, name, files1099, discountsFrom, archived, owed]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        accountId:
          type: string
          format: uuid
          description: The member this payee is, if they are one.
        accountName:
          type: string
        files1099:
          type: boolean
          description: Whether the studio files a 1099-NEC for them.
        w9ReceivedOn:
          type: string
          format: date
        consignorShare:
          $ref: "#/components/schemas/Share"
        discountsFrom:
          $ref: "#/components/schemas/DiscountsFrom"
        consignmentDays:
          type: integer
          format: int32
          description: How long unsold work stays before it goes back to the artist. Absent for no limit.
        archived:
          type: boolean
        owed:
          $ref: "#/components/schemas/SignedDecimal"

    SavePayeeRequest:
      type: object
      required: [name, files1099]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          maxLength: 254
        accountId:
          type: string
          format: uuid
        files1099:
          type: boolean
        w9ReceivedOn:
          type: string
          format: date
          description: When the payee's W-9 arrived. The tax id itself is never sent here.
        consignorShare:
          $ref: "#/components/schemas/Share"
        discountsFrom:
          $ref: "#/components/schemas/DiscountsFrom"
        consignmentDays:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          description: |
            How long the studio keeps unsold work before it goes back to the artist; leave out
            for no limit. Applies to work taken in from now on.
        archived:
          type: boolean

    ConsignmentItem:
      type: object
      required: [id, payeeId, payeeName, description, retailPrice, consignorShare, discountsFrom, quantity, sold,
                 returned, inStock, receivedOn, dueBack]
      properties:
        id:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        payeeName:
          type: string
        description:
          type: string
        retailPrice:
          $ref: "#/components/schemas/Decimal"
        consignorShare:
          $ref: "#/components/schemas/Share"
        discountsFrom:
          $ref: "#/components/schemas/DiscountsFrom"
        quantity:
          type: integer
          format: int32
        sold:
          type: integer
          format: int32
        returned:
          type: integer
          format: int32
        inStock:
          type: integer
          format: int32
        receivedOn:
          type: string
          format: date
        returnBy:
          type: string
          format: date
          description: When unsold work goes back to the artist, from their consignment period.
        dueBack:
          type: boolean
          description: Past its return date with some still on the shelf.

    PaymentRunRequest:
      type: object
      required: [method, payments]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        paidOn:
          type: string
          format: date
        payments:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [payeeId, amount]
            properties:
              payeeId:
                type: string
                format: uuid
              amount:
                $ref: "#/components/schemas/Decimal"
              reference:
                type: string
                maxLength: 80
                examples: ["Cheque 1043"]

    MyConsignment:
      type: object
      required: [payeeId, name, owed, items, sales]
      properties:
        payeeId:
          type: string
          format: uuid
        name:
          type: string
        owed:
          $ref: "#/components/schemas/SignedDecimal"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ConsignmentItem"
        sales:
          type: array
          items:
            $ref: "#/components/schemas/ConsignmentSale"

    ImportMembersRequest:
      type: object
      required: [rows]
      properties:
        dryRun:
          type: boolean
          default: false
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [line]
            description: The text in each mapped column. Leave a column out if it wasn't mapped.
            properties:
              line:
                type: integer
                format: int32
                description: The row's line in the file, echoed back in the result.
              email:
                type: string
                maxLength: 500
              balance:
                type: string
                maxLength: 50
                description: |
                  What they owed the studio, such as "$12.50"; negative or in parentheses if the
                  studio owed them.
              balanceAsOf:
                type: string
                maxLength: 50

    ImportConsignmentRequest:
      type: object
      required: [rows]
      properties:
        dryRun:
          type: boolean
          default: false
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [line]
            properties:
              line:
                type: integer
                format: int32
              artist:
                type: string
                maxLength: 500
              artistEmail:
                type: string
                maxLength: 500
              description:
                type: string
                maxLength: 500
              retailPrice:
                type: string
                maxLength: 50
              quantity:
                type: string
                maxLength: 50
              artistShare:
                type: string
                maxLength: 50
                description: The artist's share, such as "60%" or "0.6".
              receivedOn:
                type: string
                maxLength: 50

    ImportResult:
      type: object
      required: [committed, rows]
      properties:
        committed:
          type: boolean
          description: False for a dry run, or when any row has an error; then nothing was kept.
        rows:
          type: array
          items:
            type: object
            required: [line, outcome, message]
            properties:
              line:
                type: integer
                format: int32
              outcome:
                type: string
                enum: [CREATED, UPDATED, SKIPPED, ERROR]
              message:
                type: string

    TakeInConsignmentRequest:
      type: object
      required: [payeeId, description, retailPrice]
      properties:
        payeeId:
          type: string
          format: uuid
        description:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Celadon mug"]
        retailPrice:
          $ref: "#/components/schemas/Decimal"
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          default: 1
        consignorShare:
          $ref: "#/components/schemas/Share"
        receivedOn:
          type: string
          format: date

    SellConsignmentRequest:
      type: object
      required: [provider]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          default: 1
        price:
          $ref: "#/components/schemas/Decimal"
        provider:
          $ref: "#/components/schemas/Provider"

    ReturnConsignmentRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1

    ConsignmentSale:
      type: object
      required: [id, itemId, description, quantity, price, consignorAmount, tax, provider, soldOn]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        description:
          type: string
          description: What was sold, from the consigned item.
        quantity:
          type: integer
          format: int32
        price:
          $ref: "#/components/schemas/Decimal"
        consignorAmount:
          $ref: "#/components/schemas/Decimal"
        tax:
          $ref: "#/components/schemas/Decimal"
        provider:
          $ref: "#/components/schemas/Provider"
        soldOn:
          type: string
          format: date
        refundedOn:
          type: string
          format: date

    RecordEarningRequest:
      type: object
      required: [kind, description]
      description: Give either the amount, or what the class took (gross) and the payee's share.
      properties:
        kind:
          $ref: "#/components/schemas/EarningKind"
        description:
          type: string
          minLength: 1
          maxLength: 120
          examples: ["Wheel 101, spring session"]
        earnedOn:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/SignedDecimal"
        gross:
          $ref: "#/components/schemas/Decimal"
        share:
          $ref: "#/components/schemas/Share"

    Earning:
      type: object
      required: [id, payeeId, kind, description, earnedOn, amount]
      properties:
        id:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/EarningKind"
        description:
          type: string
        earnedOn:
          type: string
          format: date
        gross:
          $ref: "#/components/schemas/Decimal"
        share:
          $ref: "#/components/schemas/Share"
        amount:
          $ref: "#/components/schemas/SignedDecimal"

    PayPayeeRequest:
      type: object
      required: [amount, method]
      properties:
        amount:
          $ref: "#/components/schemas/Decimal"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference:
          type: string
          maxLength: 80
          examples: ["Cheque 1043"]
        paidOn:
          type: string
          format: date

    PayeePayment:
      type: object
      required: [id, payeeId, paidOn, amount, method]
      properties:
        id:
          type: string
          format: uuid
        payeeId:
          type: string
          format: uuid
        paidOn:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Decimal"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference:
          type: string

    PayeeStatementLine:
      type: object
      required: [date, kind, memo, amount]
      properties:
        date:
          type: string
          format: date
        kind:
          type: string
          description: The journal entry's kind, such as CONSIGNMENT_SALE or PAYEE_PAYMENT.
        memo:
          type: string
        amount:
          $ref: "#/components/schemas/SignedDecimal"

    PayeeStatement:
      type: object
      required: [payeeId, payeeName, from, to, opening, lines, closing]
      properties:
        payeeId:
          type: string
          format: uuid
        payeeName:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        opening:
          $ref: "#/components/schemas/SignedDecimal"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PayeeStatementLine"
        closing:
          $ref: "#/components/schemas/SignedDecimal"

    NecLine:
      type: object
      required: [payeeId, name, reportable, paidThroughNetworks, meetsThreshold]
      properties:
        payeeId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        w9ReceivedOn:
          type: string
          format: date
        reportable:
          $ref: "#/components/schemas/Decimal"
        paidThroughNetworks:
          $ref: "#/components/schemas/Decimal"
        meetsThreshold:
          type: boolean

    NecReport:
      type: object
      required: [year, threshold, payees]
      properties:
        year:
          type: integer
          format: int32
        threshold:
          $ref: "#/components/schemas/Decimal"
        payees:
          type: array
          items:
            $ref: "#/components/schemas/NecLine"

    WebhookEventType:
      type: string
      enum: [pieces.ready, fee.charged, member.joined, ping]

    WeeklyActivity:
      type: object
      required: [streaming, weeks]
      properties:
        streaming:
          type: boolean
          description: Whether the event stream, and so these totals, are on.
        weeks:
          type: array
          items:
            $ref: "#/components/schemas/ActivityWeek"

    ActivityWeek:
      type: object
      required: [weekStart, firings, piecesFired, membersJoined, kilns, fees]
      properties:
        weekStart:
          type: string
          format: date
          description: The Monday the week starts on, in the studio's time zone.
        firings:
          type: integer
        piecesFired:
          type: integer
        membersJoined:
          type: integer
        kilns:
          type: array
          items:
            type: object
            required: [kilnId, kiln, firings]
            properties:
              kilnId:
                type: string
                format: uuid
              kiln:
                type: string
                description: The kiln's name, as of its latest firing that week.
              firings:
                type: integer
        fees:
          type: array
          description: Fees charged to members, one entry per currency.
          items:
            type: object
            required: [currency, amount, count]
            properties:
              currency:
                type: string
              amount:
                type: string
                description: A decimal, such as "125.50".
              count:
                type: integer

    WebhookEventTypeInfo:
      type: object
      required: [type, description, example]
      properties:
        type:
          $ref: "#/components/schemas/WebhookEventType"
        description:
          type: string
        example:
          type: object
          additionalProperties: true
          description: A whole payload as it would be POSTed, with made-up values.

    WebhookEndpoint:
      type: object
      required: [id, url, eventTypes, enabled, consecutiveFailures, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        description:
          type: string
        eventTypes:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        enabled:
          type: boolean
        disabledReason:
          type: string
          description: Why it was turned off automatically, if it was.
        consecutiveFailures:
          type: integer
          format: int32
        previousSecretValidUntil:
          type: string
          format: date-time
          description: Set during a rotation, while the old secret still signs too.
        createdAt:
          type: string
          format: date-time

    CreateWebhookEndpoint:
      type: object
      required: [url, eventTypes]
      properties:
        url:
          type: string
          maxLength: 2000
        description:
          type: string
          maxLength: 200
        eventTypes:
          type: array
          minItems: 1
          items:
