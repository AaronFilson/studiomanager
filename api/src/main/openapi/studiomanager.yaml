    PendingActionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    PendingAction:
      type: object
      description: |
        A change an assistant proposed. `reason` is the assistant's own words, and `subjectName`
        the item's or asset's name when it was proposed: show both as plain text.
      required: [id, kind, status, subjectName, proposedBy, proposedAt, version]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PendingActionKind"
