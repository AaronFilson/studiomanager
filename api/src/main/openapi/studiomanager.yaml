openapi: 3.1.0
info:
  title: Studio Manager API
  version: 0.1.0
  description: |
    The HTTP contract for Studio Manager. This file is the source of truth: the Spring
    server interfaces (Gradle `openApiGenerate`) and the TypeScript client
    (`packages/api-client`) are both generated from it, so a change here fails the
    build on whichever side has not caught up.

    Errors use RFC 9457 problem details (`application/problem+json`).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: account
    description: The signed-in person.
  - name: studios
    description: Studios (tenants) and membership in them.
  - name: members
    description: The people in a studio, and invites.
  - name: export
    description: A studio's own copy of all its data.
  - name: fees
    description: Firing-fee schedules and quotes.
  - name: pieces
    description: Members' pieces from drop-off to pickup.
  - name: kilns
    description: Kilns, their queues and firings.
  - name: maintenance
    description: Upkeep of equipment and the building, kilns included.
  - name: notifications
    description: Members' inbox, and notices from staff.
  - name: access
    description: Duties (technician, monitor, work exchange…) and certifications on equipment.
  - name: schedule
    description: The studio calendar, the staffing roster, and credited hours.
  - name: today
    description: The handover view for whoever is running the studio today.
  - name: supplies
    description: Clay and supplies, stock on hand, reorder levels and purchase requests.
  - name: ledger
    description: |
      The studio's books: what members owe, prepaid balances, payouts from every provider,
      tax rates by date, and the daily summary that feeds QuickBooks or Xero.

paths:
  /api/v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in account and the studios it belongs to
      description: |
        The first call after sign-in. Creates the account record on first use, keyed by
        the token's issuer and subject.
      responses:
        "200":
          description: The signed-in account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/studios:
    post:
      tags: [studios]
      operationId: createStudio
      summary: Create a studio, with the caller as its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudioRequest"
      responses:
        "201":
          description: The new studio.
          headers:
            Location:
              description: URL of the new studio.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Studio"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/studios/{studioId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [studios]
      operationId: getStudio
      summary: A studio the caller belongs to
      responses:
        "200":
          description: The studio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Studio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/export:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [export]
      operationId: exportStudio
      summary: Everything the studio holds, as a ZIP of CSV files (owner only)
      description: |
        One CSV per table, with a header row, plus `members.csv` with each member's name and
        email address. Photos are listed but their images aren't included. The studio's data
        is read in one transaction, so the files agree with each other.
      responses:
        "200":
          description: The ZIP.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/members:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [members]
      operationId: listMembers
      summary: Everyone in the studio (staff only)
      responses:
        "200":
          description: Members, owners first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/invites:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [members]
      operationId: listOpenInvites
      summary: Invites not yet accepted, newest first (staff only)
      description: |
        Both emailed invites and link invites. Expired ones are included, so staff can see who
        never joined and send again.
      responses:
        "200":
          description: The open invites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [members]
      operationId: createInvite
      summary: Invite someone into the studio (staff only)
      description: |
        Returns a one-time code, valid for 14 days. Nobody can invite to a role above their own.
        The code is shown only here; the server keeps just its hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/invites/emails:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    post:
      tags: [members]
      operationId: emailInvites
      summary: Email an invite to each address in a pasted list (staff only)
      description: |
        Takes text as pasted from a spreadsheet, a mailing list or an email's To line, and finds
        the addresses in it (`Jane Doe <jane@example.com>` works). Each new address gets its own
        invite, emailed after this request commits. Addresses that already belong to a member,
        or that already have an unexpired invite, are skipped and reported. At most 200
        addresses at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInvitesRequest"
      responses:
        "200":
          description: What was sent and what was skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInvitesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/InviteId"
    delete:
      tags: [members]
      operationId: revokeInvite
      summary: Withdraw an invite that hasn't been accepted (staff only)
      responses:
        "204":
          description: Revoked. Its code no longer works.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/invites/{inviteId}/resend:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/InviteId"
    post:
      tags: [members]
      operationId: resendInvite
      summary: Email an invite again, with a new code and a fresh 14 days (staff only)
      description: Only for emailed invites. The code in any earlier email stops working.
      responses:
        "200":
          description: The invite, as it will be sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenInvite"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/invites/{code}/accept:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          minLength: 10
          maxLength: 64
    post:
      tags: [members]
      operationId: acceptInvite
      summary: Join a studio with an invite code
      responses:
        "200":
          description: The studio joined, and the role in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/fee-schedule:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [fees]
      operationId: getFeeSchedule
      summary: The current firing-fee schedule
      description: Version 0 means the studio hasn't set fees, so pieces fire free.
      responses:
        "200":
          description: The current version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [fees]
      operationId: saveFeeSchedule
      summary: Save the fees as a new version (staff only)
      description: Earlier versions are kept, and pieces keep the version they were priced with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveFeeScheduleRequest"
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeSchedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/fee-quotes:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    post:
      tags: [fees]
      operationId: quoteFee
      summary: Price a piece without taking it in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PieceSize"
      responses:
        "200":
          description: The price, with the working shown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeeQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/piece-policy:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [pieces]
      operationId: getPiecePolicy
      summary: How long ready pieces are held
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiecePolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [pieces]
      operationId: savePiecePolicy
      summary: Change how long ready pieces are held (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PiecePolicy"
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiecePolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/pieces:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [pieces]
      operationId: listPieces
      summary: Pieces, newest first
      description: Staff see every piece. Members see only their own, whatever the filter says.
      parameters:
        - name: stage
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PieceStage"
        - name: maker
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Up to 500 pieces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Piece"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [pieces]
      operationId: intakePiece
      summary: Take in a piece
      description: |
        Numbers the piece and prices it with the current fee schedule. The fee is a snapshot:
        later fee changes don't alter it. Members can drop off only their own pieces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakePieceRequest"
      responses:
        "201":
          description: The new piece.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/pieces/{pieceId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/PieceId"
    get:
      tags: [pieces]
      operationId: getPiece
      summary: One piece and its timeline
      responses:
        "200":
          description: The piece.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/pieces/{pieceId}/moves:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/PieceId"
    post:
      tags: [pieces]
      operationId: movePiece
      summary: Move a piece to its next stage (staff only)
      description: Reaching READY starts the hold period.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovePieceRequest"
      responses:
        "200":
          description: The piece after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/pieces/{pieceId}/photos:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/PieceId"
    post:
      tags: [pieces]
      operationId: startPhotoUpload
      summary: Start adding a photo to a piece
      description: |
        Returns two signed URLs, one for the photo and one for its thumbnail. Upload each as a
        JPEG straight to storage with `PUT`, the headers `x-ms-blob-type: BlockBlob` and
        `Content-Type: image/jpeg`, and no bearer token. Then call `completePhotoUpload`.
        Shrink the image first (a 1600-pixel long edge for the photo and 320 for the thumbnail
        suit a shelf), which also drops the location the camera stored in it.

        Anyone who can see the piece can add photos, up to 6 a piece.
      responses:
        "201":
          description: Where to upload. The URLs expire after 15 minutes and can each be used once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/pieces/{pieceId}/photos/{photoId}/complete:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/PieceId"
      - $ref: "#/components/parameters/PhotoId"
    post:
      tags: [pieces]
      operationId: completePhotoUpload
      summary: Finish adding a photo, once both images are uploaded
      description: |
        Checks that both images arrived, are JPEGs and are within the size limits, then shows
        the photo on the piece. Calling it again for a finished photo changes nothing. An upload
        that is never finished is removed after a day.
      responses:
        "200":
          description: The piece, with the new photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Piece"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/pieces/{pieceId}/photos/{photoId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/PieceId"
      - $ref: "#/components/parameters/PhotoId"
    delete:
      tags: [pieces]
      operationId: deletePhoto
      summary: Remove a photo from a piece
      description: Anyone who can see the piece can remove its photos.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/studios/{studioId}/kilns:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [kilns]
      operationId: listKilns
      summary: The studio's kilns, with availability and firing counts
      responses:
        "200":
          description: Kilns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kiln"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [kilns]
      operationId: createKiln
      summary: Add a kiln (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveKilnRequest"
      responses:
        "201":
          description: The kiln.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiln"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/kilns/{kilnId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/KilnId"
    put:
      tags: [kilns]
      operationId: updateKiln
      summary: Change a kiln's settings (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKilnRequest"
      responses:
        "200":
          description: The kiln.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiln"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/kilns/{kilnId}/availability:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/KilnId"
    put:
      tags: [kilns]
      operationId: setKilnAvailability
      summary: Take a kiln out of service, or put it back (staff only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KilnAvailabilityRequest"
      responses:
        "200":
          description: The kiln.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kiln"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/maintenance/assets:
    parameters:
      - $ref: "#/components/parameters/StudioId"
    get:
      tags: [maintenance]
      operationId: listAssets
      summary: Everything the studio maintains, with each one's tasks and when they fall due (staff only)
      description: Kilns are included automatically. Archived assets are left out.
      responses:
        "200":
          description: Assets, kilns first, then by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [maintenance]
      operationId: createAsset
      summary: Add something to maintain, such as a pug mill, the clay trap or the roof (staff only)
      description: Kilns are added on the kilns page and appear here by themselves, so KILN isn't accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveAssetRequest"
      responses:
        "201":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/studios/{studioId}/maintenance/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/AssetId"
    put:
      tags: [maintenance]
      operationId: updateAsset
      summary: Rename an asset or change its location and notes (staff only)
      description: A kiln asset takes its name from the kiln, so `name` is ignored for one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetRequest"
      responses:
        "200":
          description: The asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [maintenance]
      operationId: archiveAsset
      summary: Stop tracking an asset (staff only)
      description: Its history is kept. A kiln's asset goes when the kiln does, so it can't be archived here.
      responses:
        "204":
          description: Archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/studios/{studioId}/maintenance/assets/{assetId}/availability:
    parameters:
      - $ref: "#/components/parameters/StudioId"
      - $ref: "#/components/parameters/AssetId"
    put:
      tags: [maintenance]
      operationId: setAssetAvailability
