name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.16.6
  TFLINT_VERSION: v0.64.0

jobs:
  api:
    name: API (build and test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Unit and Testcontainers integration tests; ubuntu-latest has Docker.
      - run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: api/build/reports/tests/
          retention-days: 7

      # JaCoCo: unit and integration tests together, since CI runs both
      - name: Coverage summary
        if: success()
        run: |
          report=build/reports/jacoco/test/jacocoTestReport.xml
          line=$(grep -o '<counter type="LINE"[^>]*/>' "$report" | tail -1)
          missed=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
          covered=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
          echo "### API line coverage: $(( 100 * covered / (covered + missed) ))% ($covered of $((covered + missed)) lines)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: api/build/reports/jacoco/test/
          retention-days: 14

  web:
    name: Web, mobile and API client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @studiomanager/api-client run generate
      - run: pnpm -r run typecheck
      - run: pnpm -r run lint
      - run: pnpm -r run test
      - run: pnpm -r run build

      # Two generated files are committed: the API client (from api/src/main/openapi, regenerated
      # above) and web/src/routeTree.gen.ts (regenerated by the build). Neither step may change
      # anything, or code and source of truth have drifted apart.
      - name: Generated code is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git --no-pager diff
            echo "::error::Generated files are out of date. Run 'pnpm --filter @studiomanager/api-client run generate' and 'pnpm -r run build', then commit the result."
            exit 1
          fi

  infra:
    name: Terraform (fmt, validate, test, lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: terraform fmt -check -recursive

      # Offline: no backend, no credentials. Tests use mocked providers.
      - name: Validate and test root modules
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in bootstrap identity envs/dev; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            if [ -d "$dir/tests" ]; then terraform -chdir="$dir" test; fi
            echo "::endgroup::"
          done

      - name: Test shared modules
        run: |
          for dir in modules/*/; do
            if [ -d "$dir/tests" ]; then
              echo "::group::$dir"
              terraform -chdir="$dir" init -backend=false -input=false
              terraform -chdir="$dir" test
              echo "::endgroup::"
            fi
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
          github_token: ${{ github.token }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact

  plan-dev:
    name: Terraform plan (dev)
    needs: infra
    # Same-repo PRs only (forks get no OIDC token), and only once Azure is set up.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AZURE_CLIENT_ID_PLAN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/dev
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: >-
          terraform init -input=false -lockfile=readonly
          -backend-config=backend.hcl
          -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT"

      # The plan identity is read-only (Reader on the resource group, Blob Data Reader on
      # state), so: no state lock, and no refresh, because refreshing some resources (Static
      # Web Apps, for one) calls list-secrets actions that Reader doesn't have. The plan shows
      # configuration changes against the last applied state; the deploy job's plan catches drift.
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock=false -refresh=false -var-file=dev.tfvars -out=tfplan
          {
            echo "### Terraform plan: dev"
            echo
            echo "Configuration changes against the last applied state (\`-refresh=false\`, read-only identity)."
            echo
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
